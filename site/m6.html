<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>咕嘎六号 · 手机版</title>
<style>
:root{
  --bg:#0A0A0A; --surface:#171717; --elev:#1E1E1E; --sunken:#0E0E0E;
  --border:#2A2A2E; --border-h:#3A3A40;
  --fg:#EDEDEF; --muted:#9A9AA2; --faint:#6B6B72;
  --accent:#7C8CFF; --accent-h:#93A0FF; --accent-dim:#7C8CFF1F; --accent-line:#7C8CFF55;
  --gold:#C6A15B; --sapphire:#2F6BE4; --sapphire-dim:#2F6BE41F; --sapphire-line:#2F6BE455;
  --ok:#30D158; --warn:#FF9F0A; --err:#FF453A;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:9999px;
  --ease:cubic-bezier(.16,1,.3,1); --d1:120ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;background-color:var(--bg);
  background-image:radial-gradient(700px 420px at 50% -14%, rgba(124,140,255,.09), transparent 70%);
  background-attachment:fixed;background-repeat:no-repeat;overscroll-behavior:none}

/* ── 顶栏 ── */
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  border-bottom:1px solid var(--border);background:rgba(23,23,23,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20}
.ibtn{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--muted);
  border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{color:var(--fg)}
.ibtn.gold{color:var(--gold);border-color:#C6A15B44}
.title{flex:1;min-width:0;text-align:center;font-weight:650;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.title .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi,#E4C57E),var(--gold));box-shadow:0 0 12px #C6A15B66}
.title .sub{font-size:11px;color:var(--faint);font-weight:400;display:block;margin-top:1px}
.title .tw{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.title .tw .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}

/* ── 聊天 ── */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 0 6px;display:flex;flex-direction:column;gap:16px}
.msg{width:100%;max-width:900px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--sapphire-dim);border:1px solid var(--sapphire-line);border-radius:var(--r-lg);
  padding:10px 14px;max-width:88%;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.msg.assistant{align-items:flex-start}
.msg.assistant .text{white-space:pre-wrap;word-break:break-word;width:100%;font-size:15.5px}
.msg.assistant .text img,.msg.user .bubble img{display:block;margin:7px 0;max-width:min(100%,420px);max-height:52vh;border-radius:10px;border:1px solid var(--border);background:var(--sunken)}
.msg.assistant .text:empty{display:none}
.msg.assistant .text strong,.msg.user .bubble strong{color:#FFF;font-weight:700}
.typing .t{color:var(--faint);font-size:13.5px}
.typing .t::after{content:"…";animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
.tools{display:flex;flex-direction:column;gap:8px;width:100%}
.tool{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:8px 12px;font-size:13px}
.tool .lb{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tool .st{font-size:11px;color:var(--faint)}
.tool .st.completed{color:var(--gold)}
.tool .st.running{color:var(--sapphire)}
.note{font-size:13px;color:var(--faint)}
.errn{background:#FF453A14;border:1px solid #FF453A55;color:#FFB4AE;border-radius:var(--r-md);padding:10px 13px;font-size:13.5px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:36px 22px}
.empty h3{color:var(--fg);font-weight:600;font-size:17px;margin-bottom:8px}
.empty p{font-size:13px;color:var(--faint);line-height:1.85}
.mlink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.enddot{display:block;width:6px;height:6px;border-radius:50%;background:#1E4A9E;margin-top:9px}
.title .dot.six{background:linear-gradient(135deg,#8FE3FF,#5AC8FA);box-shadow:0 0 12px #5AC8FA66}
.gcard{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
.gcard .hd{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.gcard .gd{font-size:12.5px;color:var(--muted);line-height:1.7}
.gcard .gb{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.gcard button{border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:var(--r-sm);padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer}
.gcard button.primary{border-color:var(--accent);color:var(--accent)}
.gcard button.danger{border-color:#FF453A66;color:#FF8E86}
.gdot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px #30D15866;flex:0 0 auto}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:12px;width:100%;align-items:stretch}
.opt{background:#6E521C2E;border:1px solid #6E521C66;color:#B8954D;border-radius:var(--r-md);padding:11px 15px;
  font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left;white-space:normal}
.opt:active{background:#7E5F2240}
.opt:disabled{opacity:.45}
.syscard{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.syshd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.syshd .dot2{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.sysrow{display:flex;align-items:center;gap:9px}
.syslab{width:42px;flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.sysbar{flex:1;height:8px;border-radius:var(--r-full);background:#ffffff10;overflow:hidden}
.sysfill{height:100%;border-radius:var(--r-full);background:var(--ok)}
.sysfill.warn{background:var(--warn)} .sysfill.err{background:var(--err)}
.sysval{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.systop{font-size:12px;color:var(--faint);border-top:1px solid var(--border);padding-top:8px}
.tobottom{position:absolute;right:14px;bottom:calc(100% + 10px);width:38px;height:38px;padding:0;border-radius:var(--r-full);
  background:var(--elev);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5}
.tobottom.show{display:flex}
.tobottom:active{color:var(--fg);border-color:var(--border-h)}

/* ── 收件箱（定时简报）卡片 ── */
.inbox{width:100%;max-width:900px;margin:0 auto;padding:0 14px}
.inbox .card{background:rgba(24,27,42,.96);border:1px solid var(--sapphire-line);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:6px;max-height:46vh;overflow-y:auto}
.inbox .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.inbox .hd .dot2{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px #C6A15B88}
.inbox .hd .pg{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.inbox .bd{font-size:14.5px;line-height:1.78;white-space:pre-wrap;word-break:break-word}
.inbox .bd strong{color:#FFF;font-weight:700}
.inbox .ack{margin-top:11px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);padding:6px 13px;font-size:12.5px;font-family:inherit;cursor:pointer}
.inbox .ack:active{color:var(--fg);border-color:var(--border-h)}

/* ── 输入区 ── */
footer{flex:0 0 auto;border-top:1px solid var(--border);background:rgba(23,23,23,.82);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));position:relative}
.ct{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:150px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-md);color:var(--fg);padding:11px 13px;font-size:16px;font-family:inherit;outline:none}
textarea:focus{border-color:var(--accent)}
.btn{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn:active{background:var(--elev);border-color:var(--border-h);color:var(--fg)}
.btn.send{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.btn.send:active{background:var(--accent-h)}
.btn.send.stop{background:#7E3530;border-color:#FF453A66;color:#F3C6C2}
.btn.send.idle{background:var(--surface);border-color:var(--border);color:var(--faint)}
.btn.rec{background:#7E3530;border-color:#FF453A66;color:#F3C6C2;animation:pulse 1.4s var(--ease) infinite}
.btn.drag{border-color:var(--accent);color:var(--accent)}
/* ── 附件（回形针）── */
.ct.composer{flex-wrap:wrap}
.ct .att{flex:1 0 100%;display:none;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.ct .att.on{display:flex}
.attchip{display:flex;align-items:center;gap:7px;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-full);padding:3px 9px 3px 4px;font-size:12.5px;color:var(--muted);max-width:250px}
.attchip img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#0A0A0A}
.attchip .ico{width:28px;height:28px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint);flex:0 0 auto}
.attchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.attchip .sz{color:var(--faint);flex:0 0 auto}
.attchip .x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.attchip.up{opacity:.65}
.attchip.bad{border-color:#FF453A66;color:#FFB4AE}
.msg.user .atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;justify-content:flex-end}
.msg.user .atts a.atchip{display:inline-flex;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-full);padding:3px 10px;font-size:12.5px;color:var(--muted);text-decoration:none}
.msg.user .atts a.atchip img{max-width:210px;max-height:210px;border-radius:var(--r-md);border:1px solid var(--border);display:block}
.msg.user .atts a.atimg{border:0;background:transparent;padding:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hint{max-width:900px;margin:7px auto 0;font-size:11.5px;color:var(--faint);display:none}
.hint.show{display:block}
.composer.invalid textarea{border-color:var(--err)}

/* ── 会话抽屉 ── */
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:30}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(310px,84vw);background:var(--sunken);border-right:1px solid var(--border);
  transform:translateX(-102%);transition:transform .24s var(--ease);z-index:31;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top) + 10px)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:0 12px 10px;border-bottom:1px solid var(--border)}
.dhead .tt{flex:1;font-weight:600;font-size:14.5px}
.newbtn{background:var(--accent);color:#0A0A0A;border:none;border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer}
.newbtn:active{background:var(--accent-h)}
.sessions{flex:1;overflow-y:auto;padding:8px}
.sess{padding:10px 11px;border-radius:var(--r-sm);border:1px solid transparent;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.sess:active{background:var(--elev)}
.sess.active{background:var(--elev);border-color:var(--border)}
.sess .b{flex:1;min-width:0}
.sess .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11.5px;color:var(--faint);margin-top:2px}
.sdel{border:none;background:transparent;color:var(--faint);font-size:15px;padding:4px}
.dfoot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px}
.dfoot a,.dfoot button{flex:1;text-align:center;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px;background:transparent;font-family:inherit;cursor:pointer}
.dfoot button:active{background:var(--elev);color:var(--fg)}

/* ── 待办面板（抽屉底部「待办」打开；手机上看今天要做的事） ── */
.teod{padding:10px 14px 8px;display:flex;align-items:center;gap:8px}
.teod button{flex:1;appearance:none;font:inherit;font-size:13px;color:#9aa7ff;cursor:pointer;
  border:1px dashed rgba(109,124,255,.45);background:rgba(109,124,255,.08);border-radius:10px;padding:9px 10px}
.teod button.done{color:#4ec9a7;border-style:solid;border-color:rgba(78,201,167,.45);background:rgba(78,201,167,.1);cursor:default}
.teod button:disabled{opacity:.6}
.teod span{font-size:11.5px;color:#6f7686}
.thdr{font-size:11px;letter-spacing:.1em;color:#6f7686;padding:9px 2px 3px;display:flex;gap:6px;align-items:baseline}
.thdr i{font-style:normal;opacity:.6;font-size:10px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:32;max-height:72vh;display:flex;flex-direction:column;
  background:var(--sunken);border-top:1px solid var(--border);border-radius:16px 16px 0 0;
  transform:translateY(102%);transition:transform .24s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -20px 50px #000a}
.sheet.open{transform:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--border)}
.sheet .sh .tt{flex:1;font-weight:600;font-size:14.5px}
.sheet .sh .sm{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sheet .x{border:none;background:transparent;color:var(--faint);font-size:17px;padding:2px 6px;cursor:pointer}
.tlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 10px 14px}
.trow{display:flex;align-items:flex-start;gap:10px;padding:10px 6px;border-radius:var(--r-sm)}
.trow:active{background:#ffffff08}
.trow .cb{width:20px;height:20px;flex:0 0 auto;margin-top:1px;border:1.5px solid var(--border-h);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-size:12px;line-height:1}
.trow.done .cb{background:var(--accent);border-color:var(--accent)}
.trow .tx{flex:1;font-size:15px;word-break:break-word}
.trow.done .tx{color:var(--faint);text-decoration:line-through}
.trow.done{opacity:.55}
.trow.done .cb{background:var(--faint);border-color:var(--faint);color:#0A0A0A}
.tempty{color:var(--faint);font-size:13.5px;text-align:center;padding:22px 10px}
.tsub{color:var(--faint);font-size:12px;letter-spacing:.04em;padding:16px 6px 2px;margin-top:10px;border-top:1px solid var(--border)}
/* ── 干活中：run 期间常驻（浮在输入框上方） ── */
.ct.composer{position:relative}
.busybar{position:absolute;left:0;right:0;bottom:100%;display:none;justify-content:center;padding:0 0 7px;pointer-events:none;z-index:32}
.busybar.on{display:flex}
.busybar .pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;background:rgba(9,10,14,.88);border:1px solid var(--border);font-size:12px;color:var(--muted);box-shadow:0 6px 18px rgba(0,0,0,.36)}
.busybar .bdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;animation:pulse 1.15s ease-in-out infinite}
.busybar .btxt{font-variant-numeric:tabular-nums;max-width:min(78vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 干活条：常驻 + 可缩回。收起是一行，点开展开这一轮的步骤 */
.busybar{flex-direction:column;align-items:center;gap:6px}
.busybar .pill{pointer-events:auto;cursor:pointer;user-select:none}
.busybar .bchev{font-size:9.5px;line-height:1;opacity:.62}
.busybar.done .bdot{animation:none;background:var(--ok)}
.busy-log{display:none;pointer-events:auto;width:min(420px,88vw);max-height:34vh;overflow-y:auto;overscroll-behavior:contain;
  padding:7px 10px;border-radius:12px;background:rgba(9,10,14,.94);border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.42);font-size:12px;line-height:1.5;animation:fade .16s var(--ease)}
.busybar.expanded .busy-log{display:block}
.bl-row{display:flex;gap:7px;align-items:baseline;padding:2.5px 0}
.bl-row+.bl-row{border-top:1px solid rgba(255,255,255,.035)}
.bl-t{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:10.5px;min-width:30px}
.bl-n{flex:0 0 auto;color:var(--accent);font-size:11.5px}
.bl-row.ok .bl-n{color:var(--ok)}
.bl-p{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.bl-empty{color:var(--muted);font-size:11.5px}
/* ── 审批卡片：需要主人点头的操作 ── */
.appr{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid #FF9F0A66;border-radius:var(--r-md);padding:10px 12px;font-size:13px;animation:fade .2s var(--ease)}
.appr .ap-hd{color:var(--warn)}
.appr .ap-cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;word-break:break-all;white-space:pre-wrap;max-height:120px;overflow:auto}
.appr .ap-row{display:flex;gap:8px;flex-wrap:wrap}
.appr .ap-btn{border-radius:var(--r-full);font-size:12.5px;padding:6px 14px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--fg);font-family:inherit}
.appr .ap-btn.primary{background:var(--accent);border-color:var(--accent);color:#0A0A0A;font-weight:600}
.appr .ap-btn.deny{color:#FFB4AE;border-color:#FF453A66}
.appr .ap-btn:disabled{opacity:.45}
.appr.done{opacity:.7}
/* ── 轻提示：操作被拒时给一句话，别静默（删不掉的对话） ── */
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,8px);background:rgba(12,13,18,.94);border:1px solid #FF9F0A66;color:var(--fg);font-size:13px;line-height:1.5;padding:9px 15px;border-radius:var(--r-full);box-shadow:0 8px 26px rgba(0,0,0,.45);opacity:0;transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:70;max-width:86vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ── 站点面板：手机上能用的入口（2026-10-13 家） ── */
.msep{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);padding:12px 14px 6px;letter-spacing:.4px;cursor:pointer}
.msep .ln{flex:1;height:1px;background:var(--border)}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #ffffff0a;cursor:pointer}
.mrow:active{background:#ffffff08}
.mrow .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.mrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .t .n{display:flex;align-items:center;gap:6px;font-size:14px}
.mrow .t .u{font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mrow .cp{width:34px;height:34px;flex:0 0 auto;border:1px solid var(--border);border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.mrow .cp:active{background:var(--elev);color:var(--fg)}

<body>
<header>
  <button class="ibtn" id="menu" aria-label="会话列表">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="title">
    <div class="tw"><span class="nm"><span class="dot six" style="display:inline-block;margin-right:6px"></span><span id="agentName">咕嘎六号</span></span>
    <span class="sub" id="subline">正在看接入状态…</span></div>
  </div>
  <button class="ibtn" id="connBtn" aria-label="连接信息">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>

  <form class="ct composer" id="form">
    <div class="busybar" id="busyBar" aria-live="polite">

      <span class="pill" id="busyPill"><span class="bdot"></span><span class="btxt" id="busyTxt">干活中 · 已 0 秒</span><span class="bchev" id="busyChev">▴</span></span>
    </div>
    <div class="att" id="att"></div>
    <button class="btn" type="button" id="clip" title="加附件" aria-label="加附件">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.4 11.05 12.3 20.2a5.5 5.5 0 0 1-7.8-7.8l9.1-9.1a3.7 3.7 0 0 1 5.2 5.2l-9.1 9.1a1.9 1.9 0 0 1-2.7-2.7l8.3-8.3"/></svg>

    <button type="button" id="connBtn2">连接信息</button>
    <a href="https://join.dqmguga.site/join.html" target="_blank" rel="noopener">接入页</a>
    <a href="/group.html">咕嘎群</a>

    <button class="x" type="button" id="connClose" aria-label="关闭">✕</button></div>
  <div class="tlist" id="connList"><div class="tempty">读取中…</div></div>

<script>
(function(){
"use strict";
const API='/api/hermes/p/remote';   // 六号 = 远程操作分身：自己的会话与记忆，看不到管家那边（主人 2026-10-13 要的）
const $=s=>document.querySelector(s);
const main=$('#main'), input=$('#input'), form=$('#form'), send=$('#send'), mic=$('#mic'),
      hint=$('#hint'), sessionsEl=$('#sessions'), drawer=$('#drawer'), scrim=$('#scrim'),
      toBottomBtn=$('#toBottom'), subline=$('#subline'), agentName=$('#agentName');
const isTouch=matchMedia('(hover:none)').matches;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sessions=[], currentId=null, busy=false, abortCtrl=null, runId=null, stickBottom=true;
let inboxShown=false;
const atBottom=()=> (main.scrollHeight-main.scrollTop-main.clientHeight)<80;
function scroll(smooth){ if(!stickBottom) return;
  if(smooth && !matchMedia('(prefers-reduced-motion:reduce)').matches) main.scrollTo({top:main.scrollHeight,behavior:'smooth'});
  else main.scrollTop=main.scrollHeight; }
function timeAgo(ts){ if(!ts) return ''; const m=Math.floor((Date.now()-ts*1000)/60000);
  if(m<1)return'刚刚'; if(m<60)return m+'分钟前'; const h=Math.floor(m/60); if(h<24)return h+'小时前'; return Math.floor(h/24)+'天前'; }

async function jget(p){ const r=await fetch(API+p,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function jpost(p,b){ const r=await fetch(API+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

/* ── 会话 ───────────────────────────────────────────────── */
/* ── 轻提示：删不掉时别静默 ── */
let _toastEl=null,_toastT=0;
function toast(msg){
  if(!_toastEl){ _toastEl=document.createElement('div'); _toastEl.className='toast'; document.body.appendChild(_toastEl); }
  _toastEl.textContent=msg; _toastEl.classList.add('on');
  clearTimeout(_toastT); _toastT=setTimeout(()=>_toastEl.classList.remove('on'),5000);
}
function delFailText(code,extra){
  if(code===409) return '删不掉：这段对话还在干活（有回合没结束）。等它停下来再点 ✕。';
  if(code===404) return '这段对话已经不在了，列表刷新一下就好。';
  if(code===401||code===403) return '删不掉：门卫没放行（HTTP '+code+'）——刷新页面重新登录。';
  return '删不掉：管家回了 HTTP '+code+(extra?(' · '+String(extra).slice(0,90)):'');
}
function renderSessions(){
  sessionsEl.innerHTML='';
  if(!sessions.length){ sessionsEl.innerHTML='<div class="note" style="padding:10px">还没有对话</div>'; return; }
  for(const s of sessions){
    const el=document.createElement('div'); el.className='sess'+(s.id===currentId?' active':'');
    el.innerHTML='<div class="b"><div class="t">'+esc(s.title||'新对话')+'</div><div class="m">'+(s.message_count||0)+' 条 · '+timeAgo(s.last_active||s.started_at)+'</div></div>';
    el.onclick=()=>{ closeDrawer(); selectSession(s.id); };
    const del=document.createElement('button'); del.type='button'; del.className='sdel'; del.textContent='✕';
    del.onclick=async ev=>{ ev.stopPropagation();
      if(!confirm('删掉这段对话？不能恢复。')) return;
      del.disabled=true;
      let failed=null;
      try{
        const r=await fetch(API+'/api/sessions/'+encodeURIComponent(s.id),{method:'DELETE'});
        if(!r.ok){ let ex=''; try{ const j=await r.json(); ex=(j&&j.error&&(j.error.message||j.error.code))||''; }catch(_){}
          failed=delFailText(r.status,ex); }
      }catch(e){ failed='删不掉：连不上管家（'+e.message+'）'; }
      if(failed){ del.disabled=false; toast(failed); return; }
      if(s.id===currentId) currentId=null;
      await refreshSessions();
      if(!currentId){ if(sessions.length) await selectSession(sessions[0].id); else await newSession(); } };
    el.appendChild(del); sessionsEl.appendChild(el);
  }
}
async function refreshSessions(){
  try{ const d=await jget('/api/sessions'); sessions=(d.data||[]).filter(s=>s&&s.id&&!s.hidden&&!String(s.id).startsWith('cron'));
    const cur=sessions.find(x=>x.id===currentId);
    if(cur && cur.title) subline.textContent=cur.title.slice(0,22);
  }catch(e){}
  renderSessions();
}
async function newSession(){
  closeDrawer();
  try{ const d=await jpost('/api/sessions',{}); const s=d.session;
    sessions.unshift({id:s.id,title:null,message_count:0,last_active:s.started_at});
    currentId=s.id; renderSessions(); showEmpty();
    agentName.textContent='咕嘎六号';
    const gg=pickGuest();                    // 有机器在，就给这段对话挂个认得出的名字
    if(gg){ try{ await fetch(API+'/api/sessions/'+encodeURIComponent(s.id),{method:'PATCH',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({title:'六号 · '+(gg.name||'接入的机器')+' · '+new Date().toTimeString().slice(0,5)})}); }catch(e){} }
    bindGuest();
    restoreTurn(s.id);          // 新对话：把上一段的干活条收掉（正在跑的那轮不动）
  }catch(e){}
}
async function bindGuest(){
  const g=pickGuest();
  if(!g || !currentId) return;
  try{ await fetch('/api/join/session',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({id:g.id, session_id:currentId})}); }catch(e){}
}
async function selectSession(id){
  if(id===currentId) return;
  currentId=id; renderSessions(); loadMessages(id); bindGuest();
}

function clearChat(){ main.innerHTML=''; stickBottom=true; }
function showEmpty(){
  clearChat();
  const e=document.createElement('div'); e.className='empty';
  e.innerHTML='<h3>咕嘎六号随时待命</h3><p>接进来的机器，在这儿说人话就能操作它。<br>要动那台机器时，会弹「批准 / 拒绝」让你点头。<br><br>左上角翻以前的对话，右上角「＋」开新的；<br>顶栏那个链接图标是「连接信息」。</p>';
  main.appendChild(e);
}
/* ── 渲染 ───────────────────────────────────────────────── */
const RICH_RE=/(\*\*[^*\n]+\*\*)|(https?:\/\/[^\s<>"'）)】。，、；：！？]+)/g;
const IMG_CACHE=new Map();
function setRichText(el,text){
  el.textContent='';
  let last=0,m; RICH_RE.lastIndex=0;
  while((m=RICH_RE.exec(text))!==null){
    if(m.index>last) el.appendChild(document.createTextNode(text.slice(last,m.index)));
    if(m[1]){ const b=document.createElement('strong'); b.textContent=m[1].slice(2,-2); el.appendChild(b); }
    else { const u=m[2];
      if(/\.(png|jpe?g|gif|webp|bmp)(\?.*)?$/i.test(u)){ let im=IMG_CACHE.get(u); if(!im){ im=document.createElement('img'); im.src=u; im.alt=''; im.loading='lazy'; IMG_CACHE.set(u,im);} el.appendChild(im); }
      else { const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener noreferrer'; a.className='mlink'; a.textContent=u; el.appendChild(a); } }
    last=m.index+m[0].length;
  }
  if(last<text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
function renderSysCard(host){
  const card=document.createElement('div'); card.className='syscard';
  const hd=document.createElement('div'); hd.className='syshd';
  hd.innerHTML='<span class="dot2"></span><span>服务器资源</span>';
  card.appendChild(hd); host.appendChild(card);
  const show=(label,o)=>{
    if(!o) return;
    const row=document.createElement('div'); row.className='sysrow';
    const lab=document.createElement('div'); lab.className='syslab'; lab.textContent=label;
    const bar=document.createElement('div'); bar.className='sysbar';
    const fill=document.createElement('div'); const p=Math.max(0,Math.min(100,o.pct||0));
    fill.className='sysfill'+(p>=85?' err':p>=60?' warn':''); fill.style.width=p+'%';
    bar.appendChild(fill);
    const val=document.createElement('div'); val.className='sysval'; val.textContent=(o.used||'?')+' / '+(o.total||'?')+' · '+p+'%';
    row.appendChild(lab); row.appendChild(bar); row.appendChild(val); card.appendChild(row);
  };
  fetch('/api/sysinfo',{cache:'no-store'}).then(r=>r.json()).then(d=>{
    show('磁盘',d.disk); show('内存',d.mem); show('Swap',d.swap);
    if(d.top&&d.top.length){ const t=document.createElement('div'); t.className='systop';
      t.textContent='最占内存：'+d.top.map(x=>x.name+' '+x.mb+'M').join(' · '); card.appendChild(t); }
  }).catch(()=>{});
}
function renderRich(el,text){
  let t=String(text==null?'':text).replace(/[\s\u00a0]+$/,'');
  let dot=false, m=/(^|\n)[ \t]*•$/.exec(t);
  if(m){ dot=true; t=t.slice(0,m.index).replace(/[\s\u00a0]+$/,''); }
  let opts=[];
  const om=/(^|\n)[ \t]*::options[ \t]*\n?([\s\S]*?)(?=\n[ \t]*::sysinfo[ \t]*(?:\n|$)|$)/.exec(t);
  if(om){
    opts=(om[2]||'').split('\n').map(l=>{ const mm=/^\s*(?:\d+[.、)]|[-*])\s*(.+?)\s*$/.exec(l); return mm?mm[1]:null; }).filter(Boolean);
    t=t.slice(0,om.index)+t.slice(om.index+om[0].length).replace(/[\s\u00a0]+$/,'');
  }
  let sys=false;
  const sm=/(^|\n)[ \t]*::sysinfo[ \t]*(?=\n|$)/.exec(t);
  if(sm){ sys=true; t=t.slice(0,sm.index)+t.slice(sm.index+sm[0].length); }
  setRichText(el,t);
  if(opts.length){
    const wrap=document.createElement('div'); wrap.className='opts';
    const btns=[];
    opts.forEach(o=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=o;
      b.onclick=()=>{ btns.forEach(x=>x.disabled=true); if(busy) return; input.value=o; grow(); send_it(); };
      btns.push(b); wrap.appendChild(b);
    });
    el.appendChild(wrap);
  }
  if(dot){ const d=document.createElement('span'); d.className='enddot'; el.appendChild(d); }
  if(sys){ const host=document.createElement('div'); el.appendChild(host); renderSysCard(host); }
}
/* ── 六号的身份提示 + 空态刷新（连接一变就跟着变） ─────────── */
function guestInstructions(){
  const g=pickGuest(); if(!g) return null;
  return [
    '你就是「咕嘎六号」—— 咕嘎一号的**远程操作**分身，只管替主人在**临时接进来的那台机器**上干活。',
    '**你不记得主人的生活**（待办、饮食、作息、朋友那些都在管家那边）—— 被问到就直说：「那些在我管家那边，这边看不到。」',
    '现在接进来的是：'+(g.name||'一台机器')+'（系统 '+g.os+'，用户名 '+(g.user||'未知')+'，端口 '+g.port
      +'，权限：'+(g.mode==='full'?'**完整协助**':'**只读协助**（写/危险命令会被服务端 403 拒掉）')+'）。',
    '你**有自己的记忆文件**：`~/.hermes/guga6/MEMORY.md`（你自己那一份，和管家的记忆分开）。动手前先读它；学到跟接入、这类机器有关的长期事实（常客、它的环境、路径、踩过的坑）就**按机器名分节**写回去。',
    '这段对话**只属于这一次连接**：对方一撤销、连接一断它就没了 —— 要紧的当场说完，值得留的写进上面那份记忆。',
    '要在这台机器上执行命令，**不要用 ssh 别名**（它不在主机清单里），走服务器的 join 服务：',
    '  执行： curl -s -X POST http://127.0.0.1:8793/exec -H "X-Guga-Join-Admin: Bearer $(sudo cat /etc/guga/join_admin_secret)" -H "content-type: application/json" -d \'{"id":"'+g.id+'","cmd":"<命令>"}\'',
    '  它会回 need_confirm 和一个 id；再放行： curl -s -X POST http://127.0.0.1:8793/approve -H "X-Guga-Join-Admin: Bearer $(sudo cat /etc/guga/join_admin_secret)" -H "content-type: application/json" -d \'{"id":"<id>","decision":"yes"}\'',
    '只读协助下要动手就先请对方改成「完整协助」。',
  ].join('\n');
}
function stateEmpty(){
  const e=main.querySelector('.empty');
  if(!e) return;
  const g=pickGuest();
  e.innerHTML = g
    ? '<h3>'+(g.name||'咕嘎六号')+' 在线</h3><p>直接说想让它在<b>那台机器</b>上做什么，<br>要动手时我会先弹「批准 / 拒绝」。</p>'
    : '<h3>咕嘎六号随时待命</h3><p>现在没有机器接进来。<br>点顶栏的链接图标 → 复制接入页链接发给对方，<br>他打开点「同意」并跑一条命令就接进来了。</p>';
}
function addUser(text, files){ const w=document.createElement('div'); w.className='msg user';
  const b=document.createElement('div'); b.className='bubble';
  if(files&&files.length){
    const box=document.createElement('div'); box.className='atts';
    files.forEach(f=>{
      const a=document.createElement('a'); a.href=f.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
      if(f.kind==='image'){ a.className='atchip atimg'; const im=document.createElement('img'); im.src=f.url; im.alt=f.name||'图片'; a.appendChild(im); }
      else{ a.className='atchip'; a.textContent='📄 '+(f.name||'文件')+(f.size_h?(' · '+f.size_h):''); }
      box.appendChild(a);
    });
    b.appendChild(box);
  }
  if(text){ const t=document.createElement('div'); setRichText(t,text); b.appendChild(t); }
  w.appendChild(b); main.appendChild(w); scroll(); }
function addAssistant(){ const w=document.createElement('div'); w.className='msg assistant';
  const tools=document.createElement('div'); tools.className='tools';
  const t=document.createElement('div'); t.className='text streaming';
  const ty=document.createElement('div'); ty.className='typing'; ty.innerHTML='<span class="t">思考中</span>';
  w.appendChild(tools); w.appendChild(t); w.appendChild(ty); main.appendChild(w); scroll();
  return {w,tools,text:t,typing:ty}; }
function setText(node,text){ renderRich(node.text,text); if(text&&node.typing) node.typing.remove(); scroll(); }
function note(node,text,cls){ const d=document.createElement('div'); d.className=cls||'note'; d.textContent=text; node.w.appendChild(d); scroll(); }
function addTool(node,name,label){
  const card=document.createElement('div'); card.className='tool';
  card.innerHTML='<span class="lb">'+esc(name+(label?('  ·  '+label):''))+'</span><span class="st running">进行中</span>';
  node.tools.appendChild(card); if(node.typing) node.typing.remove(); scroll(); return card; }
function markToolDone(card){ const s=card.querySelector('.st'); if(s){ s.className='st completed'; s.textContent='完成'; } }
/* ── 审批卡片：需要主人点头的操作（run 停在 waiting_for_approval） ── */
const AP_LABEL={once:'允许这一次',session:'本对话都允许',always:'以后都允许',deny:'拒绝'};
function addApproval(node,data,rid){
  const d=data||{};
  const card=document.createElement('div'); card.className='appr';
  const hd=document.createElement('div'); hd.className='ap-hd';
  hd.textContent='⚠ 这一步需要您点头'+(d.tool?('（'+d.tool+'）'):'');
  card.appendChild(hd);
  const cmd=String(d.command||d.preview||d.detail||'').trim();
  if(cmd){ const pre=document.createElement('div'); pre.className='ap-cmd'; pre.textContent=cmd; card.appendChild(pre); }
  const row=document.createElement('div'); row.className='ap-row';
  const choices=(Array.isArray(d.choices)&&d.choices.length)?d.choices:['once','deny'];
  const btns=[];
  choices.forEach(ch=>{
    const b=document.createElement('button'); b.type='button';

/* ── SSE ───────────────────────────────────────────────── */
async function readSSE(body,onEvent){
  const reader=body.getReader(); const dec=new TextDecoder(); let buf='', ev='message', id=null;
  for(;;){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,i); buf=buf.slice(i+1);
      if(line.endsWith('\r')) line=line.slice(0,-1);
      if(line===''||line.startsWith(':')) continue;
      if(line.startsWith('event:')) ev=line.slice(6).trim();
      else if(line.startsWith('id:')){ const v=parseInt(line.slice(3).trim(),10); if(!isNaN(v)) id=v; }
      else if(line.startsWith('data:')){ const s=line.slice(5).trim(); let j=null; try{j=JSON.parse(s);}catch(_){}
        if(j) onEvent(id,ev,j); }
    }
  }
}
/* 干活条：run 全程常驻、可缩回；进度按会话存浏览器本地，离开再回来接着显示 / 自动接回 */
const ACT_KEY='gugaTurnAct.v1';
let busyIv=null, actRec=null, actSid=null, actExp=false, actSavedAt=0;
function busyFmt(s){ return s<60 ? s+' 秒' : Math.floor(s/60)+' 分 '+(s%60)+' 秒'; }
function actClock(s){ s=Math.max(0,Math.floor(s)); return s<60 ? (s+'s') : (Math.floor(s/60)+':'+String(s%60).padStart(2,'0')); }
function actAll(){ try{ const m=JSON.parse(localStorage.getItem(ACT_KEY)||'{}'); return (m&&typeof m==='object'&&!Array.isArray(m))?m:{}; }catch(e){ return {}; } }
function actStore(m){ try{ localStorage.setItem(ACT_KEY,JSON.stringify(m)); }catch(e){} }
function actPut(){ if(!actSid||!actRec) return;
  const m=actAll(); m[actSid]=actRec;
  const cut=Date.now()-2*86400000;
  for(const k in m){ if(m[k]&&(m[k].at||0)<cut) delete m[k]; }
  actStore(m); }
function actGet(sid){ const r=actAll()[sid]; return (r&&r.t0)?r:null; }
function actDel(sid){ const m=actAll(); if(m[sid]){ delete m[sid]; actStore(m); } }
function actTxt(){
  const r=actRec; if(!r) return '';
  const dur=(r.end||Date.now())-r.t0;
  if(r.state==='running') return '干活中 · 已 '+busyFmt(Math.floor(dur/1000))+(r.last?(' · '+r.last):'');
  const w={done:'已完成',fail:'出错了',stop:'已停止',ended:'已结束'}[r.state]||'已结束';
  return w+' · 用时 '+busyFmt(Math.max(1,Math.round(dur/1000)))+((r.steps&&r.steps.length)?(' · 干了 '+r.steps.length+' 步'):'');
}
function actRows(){
  const box=$('#busyLog'); if(!box) return; box.textContent='';
  const r=actRec, steps=((r&&r.steps)||[]).slice(-60);
  if(!steps.length){ const e=document.createElement('div'); e.className='bl-empty';
    e.textContent=(r&&r.state==='running')?'刚开始，还没有步骤':'这一轮没有可显示的步骤';
    box.appendChild(e); return; }
  for(const s of steps){
    const row=document.createElement('div'); row.className='bl-row'+(s.d?' ok':'');
    const t=document.createElement('span'); t.className='bl-t'; t.textContent=actClock((s.ts-r.t0)/1000);
    const n=document.createElement('span'); n.className='bl-n'; n.textContent=(s.n||'工具')+(s.d?' ✓':'');
    row.appendChild(t); row.appendChild(n);
    if(s.p){ const p=document.createElement('span'); p.className='bl-p'; p.textContent=s.p; row.appendChild(p); }
    box.appendChild(row);
  }
  box.scrollTop=box.scrollHeight;
}
function actRender(){
  const bar=$('#busyBar'); if(!bar) return;
  if(!actRec){ bar.classList.remove('on','expanded','done'); return; }
  bar.classList.add('on');
  bar.classList.toggle('expanded',actExp);
  bar.classList.toggle('done',actRec.state!=='running');
  const t=$('#busyTxt'); if(t) t.textContent=actTxt();
  const c=$('#busyChev'); if(c) c.textContent=actExp?'▾':'▴';
  if(actExp) actRows();
}
function actTimer(){
  if(busyIv){ clearInterval(busyIv); busyIv=null; }
  if(actRec&&actRec.state==='running') busyIv=setInterval(actRender,1000);
}
function actStart(sid){
  actSid=sid||currentId||null; actExp=false; actSavedAt=Date.now();
  actRec={runId:null,t0:Date.now(),end:null,state:'running',last:'正在准备',steps:[],at:Date.now()};
  actPut(); actRender(); actTimer();
}
function actBind(rid){ if(!actRec||!rid) return; actRec.runId=rid; actRec.at=Date.now(); actPut(); }
function actTouch(txt){ if(!actRec||actRec.state!=='running'||!txt) return;
  actRec.last=txt;
  if(Date.now()-actSavedAt>1500){ actSavedAt=Date.now(); actRec.at=Date.now(); actPut(); } }
function actStep(name,preview){ if(!actRec) return;
  actRec.steps=actRec.steps||[];
  actRec.steps.push({n:String(name||'工具'),p:String(preview||'').slice(0,180),ts:Date.now(),d:false});
  if(actRec.steps.length>60) actRec.steps=actRec.steps.slice(-60);
  actRec.last='正在 '+(name||'干活'); actRec.at=Date.now(); actPut(); actRender(); }
function actStepDone(){ if(!actRec||!actRec.steps||!actRec.steps.length) return;
  actRec.steps[actRec.steps.length-1].d=true; actRec.at=Date.now(); actPut(); if(actExp) actRender(); }
function actFinish(state){ if(!actRec) return;
  actRec.state=state||'ended'; actRec.end=Date.now(); actRec.at=Date.now();
  actExp=false; actPut(); actRender(); actTimer(); }
function busyUI(b){ busy=b; send.innerHTML=b?IC_STOP:IC_SEND; send.classList.toggle('stop',b);
  send.classList.toggle('idle',!b&&!input.value.trim()); }
function setBusy(b,st){
  if(b) actStart(currentId);
  else if(actRec&&actRec.state==='running') actFinish((st&&st.stopped)?'stop':'ended');
  busyUI(b); actRender(); actTimer();
}

/* 离开再回来：这一轮接着显示（还在跑就接回事件流，跑完了就收成一行） */
async function restoreTurn(sid,noDeep){
  if(!sid) return;
  if(actRec&&actRec.state==='running'&&actSid&&actSid!==sid) return;   // 别打断这一页正在跑的那轮
  if(actSid&&actSid!==sid){ actSid=null; actRec=null; actRender(); actTimer(); }
  let rec=actGet(sid);
  if(rec&&(Date.now()-rec.t0)>12*3600000){ actDel(sid); rec=null; }    // 半天前的就不提了
  if(!rec){ actSid=null; actRec=null; actRender(); actTimer(); return; }
  actSid=sid; actRec=rec; actExp=false; actRender(); actTimer();
  if(rec.state!=='running') return;
  if(!rec.runId){ actFinish('ended'); return; }
  let stt='';
  try{
    const rs=await fetch(API+'/v1/runs/'+encodeURIComponent(rec.runId),{cache:'no-store'});
    if(rs.ok){ const d=await rs.json(); stt=String(d.status||''); }
    else if(rs.status===404) stt='gone';
  }catch(e){ return; }                                                 // 连不上就先这样，下次回来再判
  if(stt==='running'||stt==='started'||stt==='in_progress'||stt==='pending'||stt==='waiting_for_approval'){
    busyUI(true);
    runId=rec.runId; abortCtrl=new AbortController();
    actRec.steps=[]; actRec.last='正在接上…'; actRec.at=Date.now(); actPut(); actRender();
    const node=addAssistant();
    const st={acc:'',lastTool:null,retryEl:null,done:false,stopped:false};
    try{ await streamRun(rec.runId,node,st); }                          // 服务器会把这一轮从头回放一遍
    catch(e){ if(e.name!=='AbortError') note(node,'接回这一轮时出错了（'+e.message+'）。','errn'); }
    finally{
      if(node.text) node.text.classList.remove('streaming');
      if(node.typing) node.typing.remove();
      if(!st.acc&&!node.tools.children.length) note(node,'（没有输出）');
      busyUI(false); abortCtrl=null; runId=null;
      if(actRec&&actRec.state==='running') actFinish(st.stopped?'stop':'ended');
      refreshSessions();
    }
  } else {
    actRec.state = stt==='failed' ? 'fail' : (stt==='interrupted' ? 'stop' : (stt?'done':'ended'));
    actRec.end=actRec.end||Date.now(); actRec.at=Date.now();
    if(actRec.steps&&actRec.steps.length) actRec.steps[actRec.steps.length-1].d=true;
    actPut();
    if(!noDeep) await loadMessages(sid,true);                           // 答案可能是他离开时刚写完的，重载一次补上
    actRec=actGet(sid)||actRec; actExp=false; actRender(); actTimer();
  }
}

function handleRunEvent(name,j,node,st){
  if(name==='message.delta'){ st.acc+=(j.delta||''); setText(node,st.acc); actTouch('正在写回复'); }
  else if(name==='tool.started'){ st.lastTool=addTool(node,j.tool||'tool',j.preview||''); if(node.typing){ const t=node.typing.querySelector('.t'); if(t) t.textContent='执行中'; } actStep(j.tool||'tool', j.preview||''); }
  else if(name==='tool.completed'){ if(st.lastTool) markToolDone(st.lastTool); actStepDone(); }
  else if(name==='message.interim'){ if(j.text) note(node,j.text); }
  else if(name==='run.completed'){ st.done=true; if(typeof j.output==='string'&&j.output) setText(node,j.output); actFinish('done'); }
  else if(name==='run.failed'){ st.done=true; note(node,'出错了：'+(j.error||j.message||'未知'),'errn'); actFinish('fail'); }
  else if(name==='run.interrupted'){ st.done=true; note(node,'这一轮被中断了。要我接着做，说一声「继续」。'); actFinish('stop'); }
  else if(name==='approval.request'){ addApproval(node, j, runId); actTouch('等你点头'); }
  else if(name==='error'){ st.done=true; note(node,'出错了：'+(j.message||j.error||'未知'),'errn'); actFinish('fail'); }
}
async function startRun(text){
  const body={input:text, session_id:currentId};
  const ins=guestInstructions();          // 临时系统提示：不落进会话历史
  if(ins) body.instructions=ins;
  const r=await fetch(API+'/v1/runs',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json(); return d.run_id||d.id||null;
}
async function streamRun(rid,node,st){
  let lastSeq=-1, tries=0;
  for(;;){
    try{
      const url=API+'/v1/runs/'+encodeURIComponent(rid)+'/events'+(lastSeq>=0?('?last_seq='+lastSeq):'');
      const res=await fetch(url,{headers:{'accept':'text/event-stream'},cache:'no-store',
        signal:abortCtrl?abortCtrl.signal:undefined});
      if(!res.ok||!res.body) throw new Error('HTTP '+res.status);
      if(st.retryEl){ st.retryEl.remove(); st.retryEl=null; }
      await readSSE(res.body,(sid,ev,j)=>{
        const name=j.event||ev; const sq=(typeof j.seq==='number')?j.seq:sid;
        if(typeof sq==='number') lastSeq=Math.max(lastSeq,sq);
        handleRunEvent(name,j,node,st);
      });
      if(st.done) return;
    }catch(err){ if(err.name==='AbortError') throw err; }
    if(st.done) return;
    tries++;
    if(tries>40){ note(node,'重连很多次都没成功，先停在这里了。','errn'); return; }
    if(!st.retryEl){ st.retryEl=document.createElement('div'); st.retryEl.className='note'; node.w.appendChild(st.retryEl); }
    st.retryEl.textContent='连接中断，2 秒后自动重连…（第 '+tries+' 次）';
    scroll();
    await new Promise(r=>setTimeout(r,2000));
  }
}

  setBusy(true); runId=null; abortCtrl=new AbortController();
  const st={acc:'',lastTool:null,retryEl:null,done:false,stopped:false};
  try{
    runId=await startRun(payload);
    if(!runId) throw new Error('no run_id');
    actBind(runId);                          // 记下 run id，离开再回来能接回这一轮
    await streamRun(runId,node,st);
  }catch(err){
    if(err.name==='AbortError'){ st.stopped=true; if(node.typing)node.typing.remove(); note(node,'已停止'); }
    else { if(node.typing)node.typing.remove(); note(node,'连接出错了（'+err.message+'）。','errn'); }
  }finally{
    if(node.text) node.text.classList.remove('streaming');
    if(node.typing) node.typing.remove();
    if(!st.acc && !node.tools.children.length && !st.stopped) note(node,'（没有输出）');
    setBusy(false, st); abortCtrl=null; runId=null;
    refreshSessions();
  }
}

  const c=document.createElement('div'); c.className='gcard';
  const hd=document.createElement('div'); hd.className='hd';
  const dot=document.createElement('span'); dot.className='gdot'+(g.connected?'':' off');
  if(!g.connected) dot.style.background='var(--faint)', dot.style.boxShadow='none';
  const nm=document.createElement('span'); nm.textContent=g.name||'（未命名）';
  hd.append(dot,nm);
  const gd=document.createElement('div'); gd.className='gd';
  gd.textContent=[ (g.os==='windows'?'Windows':(g.os||'未知系统')),
                   g.user?('用户 '+g.user):'',
                   (g.mode==='full'?'完整协助':'只读协助'),
                   '端口 '+g.port,
                   g.connected?'在线':'已断开' ].filter(Boolean).join(' · ');
  const tm=document.createElement('div'); tm.className='gd';
  tm.textContent=g.created?('接入于 '+new Date(g.created*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · 已 '+Math.max(0,Math.floor((Date.now()/1000-g.created)/60))+' 分钟'):'';
  const bar=document.createElement('div'); bar.className='gb';
  const chat=document.createElement('button'); chat.type='button'; chat.className='primary';
  chat.textContent='跟它对话'; chat.onclick=()=>{ closeSites(); closeDrawer();
    connSheet.classList.remove('open');
    (async()=>{ if(!currentId) await newSession(); })().then(()=>{
      say('往下说就行 —— 我在这台机器上干活。'); if(input) input.focus();
    });
  };
  const rv=document.createElement('button'); rv.type='button'; rv.className='danger';
  rv.textContent='断开并撤销';
  rv.onclick=async ()=>{
    if(!confirm('断开「'+(g.name||'')+'」？钥匙会作废，那边十几秒内自己把隧道拆掉。')) return;
    rv.disabled=true; rv.textContent='正在断开…';
    try{
      const r=await fetch('/api/join/revoke',{method:'POST',headers:{'content-type':'application/json'},
                                              body:JSON.stringify({id:g.id})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      say('已作废 —— 十几秒内那边会自己拆干净。');
      await loadGuests(); renderConn();
    }catch(e){ rv.disabled=false; rv.textContent='断开并撤销'; say('断开失败：'+e.message); }
  };
  bar.append(chat,rv);
  c.append(hd,gd); if(tm.textContent) c.append(tm); c.append(bar);
  return c;
}
function renderConn(){
  connCount.textContent = guests.length ? (guests.length+' 台') : '';
  connList.innerHTML='';
  if(!guests.length){
    const e=document.createElement('div'); e.className='tempty';
    e.innerHTML='现在没有机器接进来<br><br>把接入页发给对方：他打开 → 输连接密码 → 点「同意」 → 在他自己电脑上跑一条命令，就接进来了。';
    const cp=document.createElement('button'); cp.type='button'; cp.className='newbtn';
    cp.style.cssText='margin-top:14px'; cp.textContent='复制接入页链接';
    cp.onclick=()=>copyText(JOIN_BASE,'已复制接入页链接：'+JOIN_BASE);
    e.appendChild(document.createElement('div')).appendChild(cp);
    connList.appendChild(e);
    return;
  }
  guests.forEach(g=>connList.appendChild(gcard(g)));
  const hint=document.createElement('div'); hint.className='tempty';
  hint.style.padding='14px 4px 4px';
  hint.textContent='断线后这台机器就从服务器上消失了（它没有记忆文件，这段对话也只在这次连接里）。';
  connList.appendChild(hint);
}
async function loadGuests(){
  try{
    const r=await fetch('/api/join/guests',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    guests=((await r.json()).guests||[]);
  }catch(e){ guests=[]; }
  syncHeader();
  if(connSheet.classList.contains('open')) renderConn();
  stateEmpty();
}
function openSites(){ closeDrawer(); connSheet.classList.add('open'); renderConn(); loadGuests(); }
function closeSites(){ connSheet.classList.remove('open'); }
$('#connBtn').addEventListener('click',openSites);
$('#connBtn2').addEventListener('click',openSites);
$('#connClose').addEventListener('click',closeSites);

/* ── 语音输入 ───────────────────────────────────────────── */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(msg){ hint.textContent=msg; hint.classList.add('show'); clearTimeout(say._t);
  say._t=setTimeout(()=>hint.classList.remove('show'),4500); }
let rec=null, recOn=false;
if(!SR){
  mic.style.opacity='.35';
  mic.onclick=()=>say('这台设备的浏览器不支持语音输入（手机 Chrome / Safari 支持）。');
}else if(location.protocol!=='https:' && !['localhost','127.0.0.1'].includes(location.hostname)){
  mic.onclick=()=>say('语音输入要走 https（用公网域名打开就行）。');
}else{
  const paintMic=on=>{ mic.classList.toggle('rec',!!on); };
  let base='', finalTxt='', interimTxt='', timer=0, quick=0;

  const paint=()=>{ input.value=base+finalTxt+interimTxt; grow(); syncIdle(); };

  function recHalt(msg){                        // 收尾：停引擎、灭红点、给一句话
    recOn=false; clearTimeout(timer);
    const r=rec; rec=null;
    if(r){ r.onend=null; r.onerror=null; r.onresult=null; try{ r.stop(); }catch(e){} }
    paintMic(false);
    if(msg) say(msg);
  }

  function recRound(){                          // 一轮识别（安卓 Chrome 不支持 continuous，就是「一句一轮」）
    if(!recOn) return;
    const r=new SR(); rec=r;
    r.lang='zh-CN'; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
    const t0=Date.now();
    r.onresult=ev=>{ quick=0; interimTxt='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){ const x=ev.results[i];
        if(x.isFinal) finalTxt+=(x[0]&&x[0].transcript)||''; else interimTxt+=(x[0]&&x[0].transcript)||''; }
      paint(); };
    r.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        recHalt('麦克风没被允许：浏览器弹窗点「允许」，或在系统设置里给这个浏览器开麦克风。'); return; }
      if(e.error==='audio-capture'){ recHalt('手机麦克风被别的应用占着，关掉它再点一次。'); return; }
      // no-speech / aborted / network：不报错，交给 onend 接着听
    };
    r.onend=()=>{
      if(!recOn||r!==rec) return;
      quick = (Date.now()-t0<600) ? quick+1 : 0;   // 秒结束＝引擎没起来，别死循环
      if(quick>=4){ recHalt('麦克风起不来：点一下再试，或检查系统的麦克风权限。'); return; }
      clearTimeout(timer);                          // 延时续听：安卓上同步 start() 会立刻抛错
      timer=setTimeout(()=>{ if(recOn) recRound(); },400);
    };
    try{ r.start(); paintMic(true); }
    catch(e){
      rec=null; quick++;
      if(quick>=4){ recHalt('起不来麦克风：'+e.message); return; }
      clearTimeout(timer); timer=setTimeout(()=>{ if(recOn) recRound(); },500);
    }
  }

  mic.onclick=()=>{
    if(recOn){ recHalt('语音输入已结束，确认一下再发。'); return; }
    recOn=true; quick=0; finalTxt=''; interimTxt='';
    base=input.value?input.value.replace(/\s+$/,'')+' ':'';
    recRound();
    say('在听…说完再点一下麦克风结束（安卓上每说完一句会响一下、自动接着听）。');
  };
}

/* ── 定时简报（打开界面时领取未读） ───────────────────────── */
let inboxBox=null, inboxQ=[], inboxAcked=new Set();
async function refreshInbox(){
  try{
    const r=await fetch('/api/inbox',{cache:'no-store'}); if(!r.ok) return;
    applyInbox((await r.json()).items||[]);
  }catch(e){}
}
function applyInbox(items){
  const present=new Set((items||[]).map(i=>i.id));
  for(const id of [...inboxAcked]) if(!present.has(id)) inboxAcked.delete(id);
  inboxQ=(items||[]).filter(it=>!inboxAcked.has(it.id));
  paintInbox();
}
function paintInbox(){
  const n=inboxQ.length;
  if(!n){ if(inboxBox){ inboxBox.remove(); inboxBox=null; } inboxShown=false; return; }
  if(!inboxBox){
    inboxBox=document.createElement('div'); inboxBox.className='inbox';
    main.insertBefore(inboxBox, main.firstChild);
    inboxShown=true;
  }
  const it=inboxQ[0];
  inboxBox.innerHTML='';
  const c=document.createElement('div'); c.className='card';
  const hd=document.createElement('div'); hd.className='hd';
  hd.innerHTML='<span class="dot2"></span><span>'+esc(it.job)+' · '+esc(it.time)+'</span>'
             +'<span class="pg">'+(n>1?('1 / '+n):'')+'</span>';
  const bd=document.createElement('div'); bd.className='bd'; renderRich(bd,it.text);
  const ack=document.createElement('button'); ack.type='button'; ack.className='ack';
  ack.textContent=(n>1?'知道了，看下一条':'知道了');
  ack.onclick=async ()=>{ const id=it.id; inboxQ.shift(); paintInbox(); await ackInbox([id]); };
  c.appendChild(hd); c.appendChild(bd); c.appendChild(ack);
  inboxBox.appendChild(c);
}
async function ackInbox(ids){
  (ids||[]).forEach(i=>inboxAcked.add(i));
  try{
    const r=await fetch('/api/inbox',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})});
    if(r.ok) applyInbox((await r.json()).items||[]);
  }catch(e){}
}

/* ── 启动 ───────────────────────────────────────────────── */
/* iOS 键盘弹起时 100dvh 不缩水 —— 跟着 visualViewport 调高度，输入框才不会被顶住 */
if(window.visualViewport){
  const vv=window.visualViewport, fit=()=>{ document.body.style.height=vv.height+'px'; };
  vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); fit();
}

(async function start(){
  grow(); syncIdle();
  await loadGuests();
  await refreshSessions();
  // 优先接上这段连接自己的对话（桌面「远程连接」里挑的那一段），没有就挑最近一段
  const g=pickGuest();
  const want = (g && g.session_id && sessions.some(s=>s.id===g.session_id)) ? g.session_id
             : (sessions.length ? sessions[0].id : null);
  if(want) await selectSession(want); else await newSession();
  refreshInbox();
  connTimer=setInterval(()=>{ if(!document.hidden){ loadGuests(); refreshSessions(); } },20000);
})();
setInterval(()=>{ if(!document.hidden) renderSessions(); },60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ renderSessions(); refreshInbox(); } });
})();
</script>
