<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>咕嘎 · 登录</title>
<style>
:root{--bg:#08090C;--surface:#12141A;--sunken:#0C0E13;--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.17);
 --fg:#EFF1F5;--muted:#9BA1AE;--faint:#6C7280;--accent:#7C8CFF;--accent-h:#93A0FF;--gold:#C6A15B;--gold-hi:#E4C57E;
 --err:#FF453A;--r-sm:10px;--r-md:16px;--r-lg:20px;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:34px 20px;color:var(--fg);background:var(--bg);
 font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;
 background-image:radial-gradient(820px 460px at 10% -10%,rgba(124,140,255,.16),transparent 62%),
  radial-gradient(660px 420px at 98% 6%,rgba(198,161,91,.10),transparent 62%),
  radial-gradient(900px 620px at 50% 120%,rgba(124,140,255,.07),transparent 68%);
 background-attachment:fixed;-webkit-font-smoothing:antialiased}
.card{position:relative;width:min(420px,100%);padding:30px 28px 26px;border:1px solid var(--border);
 border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),var(--surface);
 box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 26px 60px -26px rgba(0,0,0,.92),0 2px 10px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(360px 170px at 50% -34%,rgba(124,140,255,.15),transparent 72%)}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:20px}
.brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));
 box-shadow:0 0 14px rgba(198,161,91,.5),0 0 0 4px rgba(198,161,91,.10)}
.brand .grow{flex:1}
.tag{font-size:11.5px;color:var(--faint);border:1px solid var(--border);border-radius:999px;padding:2px 10px;letter-spacing:.5px}
h1{font-size:22px;font-weight:650;letter-spacing:.2px;margin-bottom:8px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
label{display:block;font-size:12px;color:var(--muted);letter-spacing:.3px;margin-bottom:6px}
.field{margin-bottom:14px}
input{width:100%;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);
 padding:12px 13px;font-size:14px;outline:none;font-family:inherit;transition:.18s var(--ease)}
input::placeholder{color:var(--faint);letter-spacing:0}
input:focus{border-color:rgba(124,140,255,.6);box-shadow:0 0 0 3px rgba(124,140,255,.14)}
input.pw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em}
.primary{width:100%;border:0;border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:680;font-family:inherit;
 letter-spacing:.18em;color:#0A0A0C;cursor:pointer;transition:.18s var(--ease);margin-top:6px;
 background:linear-gradient(180deg,var(--accent-h),var(--accent));
 box-shadow:0 10px 26px -12px rgba(124,140,255,.8),0 1px 0 rgba(255,255,255,.4) inset}
.primary:hover{transform:translateY(-1px);box-shadow:0 14px 32px -12px rgba(124,140,255,.9),0 1px 0 rgba(255,255,255,.5) inset}
.primary:active{transform:translateY(0) scale(.995)}
.primary[disabled]{opacity:.75;cursor:default;transform:none}
.err{display:none;align-items:center;gap:8px;margin:0 0 14px;padding:10px 12px;border-radius:var(--r-sm);
 background:rgba(255,69,58,.10);border:1px solid rgba(255,69,58,.35);color:#FFB3AE;font-size:12.5px}
.err.on{display:flex}
.err::before{content:"!";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;
 background:var(--err);color:#0A0A0C;font-weight:800;font-size:11px;flex:0 0 auto}
@media (max-width:520px){body{padding:18px 14px;align-content:start}.card{padding:24px 20px 22px;border-radius:var(--r-md)}h1{font-size:20px}.primary{letter-spacing:.12em}}
</style></head><body>
<form class="card" id="f" autocomplete="off">
  <div class="brand"><i></i>咕嘎<span class="grow"></span><span class="tag">hub · 手机版</span></div>
  <h1>验证一下是你</h1>
  <div class="sub">咕嘎 hub 与手机版都在这道门后面。</div>

  <div class="err" id="err">用户名或密码不对，再试一次。</div>

  <div class="field">
    <label for="u">用户名</label>
    <input id="u" name="u" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用户名">
  </div>

  <div class="field">
    <label for="p">密码</label>
    <input class="pw" id="p" name="p" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="密码">
  </div>

  <button class="primary" id="go" type="submit">进 入</button>
</form>
<script>
(function(){
  "use strict";
  var f = document.getElementById('f'), uEl = document.getElementById('u'), pEl = document.getElementById('p'),
      go = document.getElementById('go'), err = document.getElementById('err');
  var real = '';                                  /* 真正的密码只存在这里，输入框里永远是乱码 */
  var NOISE = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789@#$%&*+=?!';

  function paint(){
    var s = '';
    for (var i = 0; i < real.length; i++) s += NOISE[Math.floor(Math.random() * NOISE.length)];
    if (pEl.value !== s) pEl.value = s;
  }
  function add(txt){ if (txt) { real += txt; paint(); } }

  /* beforeinput 覆盖打字 / 粘贴 / 输入法；任何路径都不会把明文留在输入框里 */
  pEl.addEventListener('beforeinput', function(e){
    var t = e.inputType || '';
    if (t === 'insertText' || t === 'insertCompositionText' || t === 'insertFromPaste' ||
        t === 'insertFromDrop' || t === 'insertReplacementText'){
      e.preventDefault();
      var txt = e.data;
      if (!txt && e.dataTransfer) { try { txt = e.dataTransfer.getData('text'); } catch (x) {} }
      add(txt);
    } else if (t.indexOf('delete') === 0){
      e.preventDefault();
      if (t === 'deleteContentBackward') real = real.slice(0, -1);
      paint();
    } else if (t === 'insertLineBreak'){
      e.preventDefault(); f.requestSubmit();
    }
  });
  pEl.addEventListener('paste', function(e){          /* 老浏览器兜底 */
    var txt = (e.clipboardData || window.clipboardData);
    if (txt && txt.getData) { e.preventDefault(); add(txt.getData('text')); }
  });
  pEl.addEventListener('focus', paint);
  pEl.addEventListener('change', paint);              /* 自动填充/外部改写一律打散 */

  function nextTarget(){
    var n = new URLSearchParams(location.search).get('next') || '';
    return (n.charAt(0) === '/' && n.charAt(1) !== '/') ? n : '/';
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.classList.remove('on');
    go.disabled = true; go.textContent = '验证中…';
    fetch('/api/gate/login', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({u: uEl.value.trim(), p: real})
    }).then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
      .then(function(res){
        if (res.ok && res.d && res.d.ok){ location.replace(nextTarget()); return; }
        throw new Error('bad');
      })
      .catch(function(){
        err.textContent = '用户名或密码不对，再试一次。';
        err.classList.add('on');
        real = ''; pEl.value = '';
        go.disabled = false; go.textContent = '进 入';
        uEl.focus();
      });
  });

  uEl.focus();
})();
</script>
</body></html>
