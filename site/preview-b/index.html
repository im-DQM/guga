<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>咕嘎 · Agent</title>
<style>
:root{
  --bg:#0A0A0A; --surface:#171717; --elev:#1E1E1E; --sunken:#0E0E0E;
  --border:#2A2A2E; --border-h:#3A3A40;
  --fg:#EDEDEF; --muted:#9A9AA2; --faint:#6B6B72;
  --accent:#7C8CFF; --accent-h:#93A0FF; --accent-dim:#7C8CFF1F; --accent-line:#7C8CFF55;
  --gold:#C6A15B; --gold-hi:#E4C57E; --sapphire:#2F6BE4; --sapphire-dim:#2F6BE41F; --sapphire-line:#2F6BE455;
  --ok:#30D158; --warn:#FF9F0A; --err:#FF453A;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:9999px;
  --ease:cubic-bezier(.16,1,.3,1); --d1:120ms; --d2:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;background-color:var(--bg);background-image:radial-gradient(1000px 560px at 50% -12%, rgba(124,140,255,.075), transparent 68%);background-attachment:fixed;background-repeat:no-repeat}
/* ── 顶栏 ── */
.topbar{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);border-bottom:1px solid var(--border);background:rgba(23,23,23,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:0 0 auto;height:64px;position:relative;z-index:6}
.brandblock{display:flex;flex-direction:column;gap:3px;justify-content:center;flex:0 0 auto}
.gauges{display:flex;flex-direction:column;gap:2px}
.gauge{display:flex;align-items:center;gap:4px}
.gk{font-size:9px;line-height:1;color:var(--faint);width:24px;letter-spacing:.3px}
.gtrack{width:82px;height:4px;border-radius:3px;background:#ffffff14;overflow:hidden}
.gfill{display:block;height:100%;border-radius:3px;width:0;transition:width .45s var(--ease)}
.gfill.hp{background:linear-gradient(90deg,#E5484D,#FF8A80)}
.gfill.mp{background:linear-gradient(90deg,#2F6BE4,#7CB0FF)}
.gfill.sp{background:linear-gradient(90deg,#2FBF6A,#7EE2A8)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:650;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));box-shadow:0 0 12px #C6A15B66}
.tabs{display:flex;gap:var(--s1);margin-left:var(--s2)}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 14px;border-radius:var(--r-full);cursor:pointer;font-size:14px;transition:color var(--d1) var(--ease),background var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.tab:hover:not(:disabled){color:var(--fg);background:#ffffff08}
.tab.active{background:var(--elev);border-color:var(--border);color:var(--fg)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);padding:5px 12px;font-size:13px;cursor:pointer;transition:color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.ghost:hover{color:var(--fg);border-color:var(--border-h)}
main{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:flex}
/* ── 管家：左会话栏 + 右聊天 ── */
#view-butler{flex-direction:row}
.sidebar{width:264px;flex:0 0 auto;border-right:1px solid var(--border);background:rgba(14,14,14,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;min-height:0}
.sidebar.collapsed{display:none}
/* ── 右侧待办面板 ── */
.todopanel{width:300px;flex:0 0 auto;border-left:1px solid var(--border);background:rgba(14,14,14,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;min-height:0}
.todopanel.collapsed{display:none}
.todo-head{padding:var(--s3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s2)}
.todo-head .tt{font-weight:600;font-size:13.5px;flex:1}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--r-full);overflow:hidden}
.seg button{background:transparent;border:none;color:var(--muted);font-size:12px;padding:4px 10px;cursor:pointer;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.seg button.on{background:var(--elev);color:var(--fg)}
.todo-list{flex:1 1 auto;overflow-y:auto;padding:var(--s2) var(--s3)}
.todo-item{display:flex;align-items:flex-start;gap:var(--s2);padding:7px 4px;border-radius:var(--r-sm)}
.todo-item:hover{background:#ffffff05}
.todo-item .cb{width:17px;height:17px;flex:0 0 auto;margin-top:2px;border:1.5px solid var(--border-h);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-size:11px;line-height:1}
.todo-item.done .cb{background:var(--accent);border-color:var(--accent)}
.todo-item .tx{flex:1;font-size:13.5px;word-break:break-word;cursor:pointer}
.todo-item.done .tx{color:var(--faint);text-decoration:line-through}
.todo-item .del{opacity:0;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;transition:opacity var(--d1) var(--ease),color var(--d1) var(--ease)}
.todo-item:hover .del{opacity:1}
.todo-item .del:hover{color:var(--err)}
.todo-foot{flex:0 0 auto;border-top:1px solid var(--border);padding:var(--s3)}
.todo-foot .row{display:flex;gap:var(--s2)}
.todo-foot input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);padding:8px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color var(--d1) var(--ease)}
.todo-foot input:focus{border-color:var(--accent)}
.todo-foot .add{background:var(--accent);border:none;color:#0A0A0A;border-radius:var(--r-sm);width:36px;cursor:pointer;font-size:17px;font-weight:700;transition:background var(--d1) var(--ease)}
.todo-foot .add:hover{background:var(--accent-h)}
.todo-empty{color:var(--faint);font-size:13px;text-align:center;padding:var(--s5) 0}
/* ── 定时消息（打开界面时领取） ── */
.inbox{flex:0 0 auto;padding:var(--s3) var(--s4) 0;display:none}
.inbox.show{display:block}
.inbox .card{max-width:940px;margin:0 auto var(--s2);background:var(--sapphire-dim);border:1px solid var(--sapphire-line);border-radius:var(--r-md);padding:10px 13px;animation:fade .2s var(--ease)}
.inbox .hd{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--muted);margin-bottom:5px}
.inbox .hd .dot2{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px #C6A15B88}
.inbox .bd{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.inbox .ack{margin-top:7px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);padding:3px 10px;font-size:12px;cursor:pointer;transition:color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.inbox .ack:hover{color:var(--fg);border-color:var(--border-h)}
/* 结尾蓝点标记 */
.enddot{display:block;width:6px;height:6px;border-radius:50%;background:#1E4A9E;margin-top:9px}
/* 正文里的链接（可点，Ctrl/直接点都在新标签打开） */
.mlink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all;cursor:pointer}
.mlink:hover{color:var(--accent-h)}
/* 可点击选项 */
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px;width:fit-content;max-width:100%;align-items:stretch}
.opt{background:#6E521C2E;border:1px solid #6E521C66;color:#B8954D;border-radius:var(--r-full);padding:8px 16px;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;white-space:normal;box-shadow:0 1px 0 #00000047;transition:background var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.opt:hover{background:#7E5F2240;border-color:#C6A15B;color:#C9A45C;transform:translateX(2px)}
.opt:disabled{opacity:.45;cursor:default;transform:none}
/* 服务器资源面板（::sysinfo） */
.syscard{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;max-width:560px;display:flex;flex-direction:column;gap:8px}
.syshd{display:flex;align-items:center;gap:var(--s2);font-size:12.5px;color:var(--muted)}
.sysrow{display:flex;align-items:center;gap:10px}
.syslab{width:46px;flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.sysbar{flex:1;height:8px;border-radius:var(--r-full);background:#ffffff10;overflow:hidden}
.sysfill{height:100%;border-radius:var(--r-full);background:var(--ok);transition:width .3s var(--ease)}
.sysfill.warn{background:var(--warn)}
.sysfill.err{background:var(--err)}
.sysval{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.systop{font-size:12px;color:var(--faint);border-top:1px solid var(--border);padding-top:8px}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--muted);width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color var(--d1) var(--ease),background var(--d1) var(--ease)}
.iconbtn:hover{color:var(--fg);background:#ffffff08}
.side-head{padding:var(--s3);border-bottom:1px solid var(--border)}
.newbtn{width:100%;background:var(--accent);color:#0A0A0A;border:none;border-radius:var(--r-sm);padding:9px;font-size:14px;font-weight:600;cursor:pointer;transition:background var(--d1) var(--ease)}
.newbtn:hover{background:var(--accent-h)}
.sessions{flex:1 1 auto;overflow-y:auto;padding:var(--s2)}
.sess{padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:var(--s1);border:1px solid transparent;transition:background var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.sess:hover{background:#ffffff05}
.sess.active{background:var(--elev);border-color:var(--border)}
.sess .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11.5px;color:var(--faint);margin-top:2px}
.chatwrap{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat{flex:1 1 auto;overflow-y:auto;padding:var(--s5) 0;display:flex;flex-direction:column;gap:var(--s5)}
.msg{max-width:min(940px,94%);margin:0 auto;width:100%;padding:0 var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--sapphire-dim);border:1px solid var(--sapphire-line);border-radius:var(--r-lg);padding:11px 15px;max-width:100%;white-space:pre-wrap;word-break:break-word}
.msg.assistant{align-items:flex-start}
.msg.assistant .text{white-space:pre-wrap;word-break:break-word}
.msg.assistant .text:empty{display:none}
.typing{align-items:flex-start}
.typing .t{color:var(--faint);font-size:13px}
.typing .t::after{content:"…";animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
.tools{display:flex;flex-direction:column;gap:var(--s2);width:100%}
.tool{display:flex;align-items:center;gap:var(--s2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-size:13px;animation:fade .2s var(--ease)}
.tool .em{display:flex;align-items:center;color:var(--faint)}
.tool .lb{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.tool .st{font-size:11px;color:var(--faint)}
.tool .st.completed{color:var(--gold)}
.tool .st.running{color:var(--sapphire)}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.note{font-size:13px;color:var(--faint)}
.errn{background:#FF453A14;border:1px solid #FF453A55;color:#FFB4AE;border-radius:var(--r-md);padding:10px 13px;font-size:13.5px}
.composer{flex:0 0 auto;border-top:1px solid var(--border);background:rgba(23,23,23,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:var(--s3) var(--s4)}
.composer .inner{max-width:940px;margin:0 auto;display:flex;gap:var(--s2);align-items:flex-end}
.composer textarea{flex:1;resize:none;height:44px;max-height:180px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--fg);padding:11px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color var(--d1) var(--ease)}
.composer textarea:focus{border-color:var(--accent)}
.send{background:var(--accent);border:none;color:#0A0A0A;border-radius:var(--r-md);width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.send:hover{background:var(--accent-h)}
.send.stop{background:#7E3530;color:#F3C6C2}
.empty{margin:auto;text-align:center;color:var(--muted);padding:var(--s8);max-width:560px}
.empty .logo{width:44px;height:44px;border-radius:var(--r-md);margin:0 auto var(--s5);background:linear-gradient(135deg,var(--sapphire),var(--accent));box-shadow:0 0 30px #2F6BE455}
.empty h3{color:var(--fg);font-weight:600;font-size:18px;margin-bottom:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;margin-top:var(--s6)}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-full);padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer;transition:color var(--d1) var(--ease),border-color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.chip:hover{color:var(--fg);border-color:var(--border-h);transform:translateY(-1px)}
/* ── 编码 ── */
#view-code iframe{flex:1;width:100%;border:0;background:#1e1e1e}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
/* 暗色滚动条 */
*{scrollbar-width:thin;scrollbar-color:#33333A transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2C2C33;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3C3C44;background-clip:content-box}
@media (max-width:720px){
  .sidebar{position:absolute;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform var(--d2) var(--ease)}
  .sidebar.open{transform:none;box-shadow:0 0 0 1px var(--border),0 8px 40px #000a}
  .todopanel,.todopanel.collapsed{position:absolute;inset:0 0 0 auto;z-index:5;display:flex;width:min(320px,86vw);transform:translateX(100%);transition:transform var(--d2) var(--ease)}
  .todopanel.open{transform:none;box-shadow:0 0 0 1px var(--border),0 8px 40px #000a}
  .msg{max-width:94%}
}
/* ══════════ 交互手感与动效（preview-b）══════════ */
.chatwrap{position:relative}
/* 焦点环：仅键盘导航出现，不干扰鼠标 */
button:focus-visible,.chip:focus-visible,.tab:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
textarea:focus-visible,input:focus-visible{outline-offset:0}
/* 按下反馈 */
.send,.newbtn,.iconbtn,.ghost,.chip,.opt,.tab,.add,.ack,.seg button,.todo-item .cb,.mlink{transition-property:background,color,border-color,transform,box-shadow,opacity;transition-duration:var(--d1);transition-timing-function:var(--ease)}
.send:active,.newbtn:active,.iconbtn:active,.ghost:active,.chip:active,.opt:active,.tab:active,.ack:active,.seg button:active{transform:scale(.96)}
.add:active{transform:scale(.92)}
.todo-item .cb:active{transform:scale(.85)}
.iconbtn:active{background:#ffffff12}
.chip:active{transform:translateY(0) scale(.97)}
.opt:active{transform:translateX(2px) scale(.98)}
/* 发送按钮：忙/空态切换动画 */
.send{transition-property:background,color,transform,box-shadow,opacity;transition-duration:var(--d1);transition-timing-function:var(--ease)}
.send:active{transform:scale(.92)}
.send.stop:hover{background:#8E3D37}
.send.idle{opacity:.5}
.send.pop{animation:pop .24s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
/* 空输入校验反馈：红边 + 轻晃 */
.composer.invalid textarea,.todo-foot.invalid input{border-color:var(--err);animation:shake .28s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* 流式打字光标 */
.msg.assistant .text.streaming::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-2px;border-radius:1px;background:var(--accent);animation:caret 1s steps(1,end) infinite}
@keyframes caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
/* 工具卡片进入 + 运行中脉冲 */
.tool{animation:toolIn .24s var(--ease)}
@keyframes toolIn{from{opacity:0;transform:translateY(4px) translateX(-3px)}to{opacity:1;transform:none}}
.tool .st.running{animation:runpulse 1.1s var(--ease) infinite}
@keyframes runpulse{0%,100%{opacity:.5}50%{opacity:1}}
/* 回到底部按钮 */
.toBottom{position:absolute;right:22px;bottom:86px;z-index:4;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--elev);border:1px solid var(--border);color:var(--muted);box-shadow:0 6px 20px #000a;opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease),color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.toBottom.show{opacity:1;transform:none;pointer-events:auto}
.toBottom:hover{color:var(--fg);border-color:var(--border-h)}
.toBottom:active{transform:scale(.9)}
/* 待办即时反馈 */
.todo-item{transition:background var(--d1) var(--ease)}
.todo-item .cb{transition:background var(--d1) var(--ease),border-color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.todo-item .tx{transition:color var(--d1) var(--ease)}
.todo-item.justdone{animation:tickPop .3s var(--ease)}
@keyframes tickPop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.todo-item.enter{animation:fade .22s var(--ease)}
.todo-item.leaving{opacity:0;transform:translateX(10px);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
/* 面板折叠展开宽度过渡（仅桌面，移动端仍走 transform） */
@media (min-width:721px){
  .sidebar{transition:width var(--d2) var(--ease)}
  .sidebar.collapsed{display:flex;width:0;min-width:0;overflow:hidden;border-right-color:transparent}
  .todopanel{transition:width var(--d2) var(--ease)}
  .todopanel.collapsed{display:flex;width:0;min-width:0;overflow:hidden;border-left-color:transparent}
  .sessions,.todo-list{min-width:0}
}
/* ══════════ 交互手感与动效 END ══════════ */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="sideToggle" aria-label="收起/展开会话" title="收起 / 展开会话"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg></button>
  <div class="brandblock">
    <div class="brand"><span class="dot"></span>咕嘎</div>
    <div class="gauges" id="gauges">
      <div class="gauge" title="血量 · 磁盘剩余"><span class="gk">DSK</span><span class="gtrack"><span class="gfill hp" id="gDsk"></span></span></div>
      <div class="gauge" title="法力 · 内存剩余"><span class="gk">MEM</span><span class="gtrack"><span class="gfill mp" id="gMem"></span></span></div>

  <section id="view-butler" class="view active">

      <div class="side-head"><button class="newbtn" id="newBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:-3px;margin-right:5px"><path d="M12 5v14M5 12h14"/></svg>新对话</button></div>

<script>
(function(){
"use strict";
const API = '/api/hermes';
const $ = s => document.querySelector(s);
const chat=$('#chat'), input=$('#input'), form=$('#composer'), sendBtn=$('#send'),
      sessionsEl=$('#sessions'), sidebar=$('#sidebar'), sideToggle=$('#sideToggle');

let sessions=[], currentId=null, busy=false, abortCtrl=null, runId=null;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let stickBottom = true;
const atBottom = () => (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < 56;
function scroll(smooth){
  if(!stickBottom) return;
  if(smooth && !reduceMotion){ chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}); }
  else { chat.scrollTop = chat.scrollHeight; }
}

async function jget(p){ const r=await fetch(API+p); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function jpost(p,b){ const r=await fetch(API+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

function timeAgo(ts){ if(!ts) return ''; const d=Date.now()-ts*1000; const m=Math.floor(d/60000); if(m<1)return'刚刚'; if(m<60)return m+'分钟前'; const h=Math.floor(m/60); if(h<24)return h+'小时前'; return Math.floor(h/24)+'天前'; }

/* ── 会话列表 ── */
function renderSessions(){
  sessionsEl.innerHTML='';
  if(!sessions.length){ sessionsEl.innerHTML='<div class="note" style="padding:8px">还没有对话</div>'; return; }
  for(const s of sessions){
    const el=document.createElement('div');
    el.className='sess'+(s.id===currentId?' active':'');
    el.innerHTML='<div class="t">'+esc(s.title||'新对话')+'</div><div class="m">'+(s.message_count||0)+' 条 · '+timeAgo(s.last_active||s.started_at)+'</div>';
    el.onclick=()=>selectSession(s.id);
    sessionsEl.appendChild(el);
  }
}
async function refreshSessions(){
  try{ const d=await jget('/api/sessions'); sessions=(d.data||[]).filter(s=>!s.hidden); }catch(e){}
  renderSessions();
}
async function newSession(){
  try{ const d=await jpost('/api/sessions',{}); const s=d.session;
    sessions.unshift({id:s.id,title:null,message_count:0,last_active:s.started_at});
    currentId=s.id; renderSessions(); showEmpty(); input.focus();
  }catch(e){ /* ignore */ }
}
async function selectSession(id){ if(id===currentId){ sidebar.classList.remove('open'); return; } currentId=id; renderSessions(); await loadMessages(id); sidebar.classList.remove('open'); }

/* ── 消息渲染 ── */
function clearChat(){ chat.innerHTML=''; stickBottom=true; }
function showEmpty(){
  clearChat();
  const e=document.createElement('div'); e.className='empty';
  e.innerHTML='<div class="logo"></div><h3>你好，我是咕嘎一号</h3>'+
    '<div>你的私人管家。说点什么，或试试下面：</div>'+
    '<div class="chips">'+
      '<span class="chip">今天有什么要提醒我的？</span>'+
      '<span class="chip">帮我总结一下这段文字</span>'+
      '<span class="chip">用终端跑个命令看看</span>'+
      '<span class="chip">记一下：我喜欢简洁的回答</span>'+
    '</div>';
  e.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ input.value=c.textContent; input.focus(); });
  chat.appendChild(e);
}
function addUser(text){ const w=document.createElement('div'); w.className='msg user';
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text; w.appendChild(b); chat.appendChild(w); scroll(); }
function addAssistant(){ const w=document.createElement('div'); w.className='msg assistant';
  const tools=document.createElement('div'); tools.className='tools';
  const t=document.createElement('div'); t.className='text streaming';
  const ty=document.createElement('div'); ty.className='typing'; ty.innerHTML='<span class="t">思考中</span>';
  w.appendChild(tools); w.appendChild(t); w.appendChild(ty); chat.appendChild(w); scroll();
  return {w,tools,text:t,typing:ty}; }
const URL_RE=/(https?:\/\/[^\s<>"'）)】。，、；：！？]+)/g;
function setRichText(el,text){
  el.textContent='';
  let last=0, m; URL_RE.lastIndex=0;
  while((m=URL_RE.exec(text))!==null){
    if(m.index>last) el.appendChild(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement('a');
    a.href=m[1]; a.target='_blank'; a.rel='noopener noreferrer'; a.className='mlink'; a.textContent=m[1];
    el.appendChild(a);
    last=m.index+m[1].length;
  }
  if(last<text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
function renderSysCard(host){
  const card=document.createElement('div'); card.className='syscard';
  const hd=document.createElement('div'); hd.className='syshd';
  hd.innerHTML='<span class="dot2"></span><span>服务器资源</span>';
  card.appendChild(hd); host.appendChild(card);
  const show=(label,o,pctKey)=>{
    if(!o) return;
    const row=document.createElement('div'); row.className='sysrow';
    const lab=document.createElement('div'); lab.className='syslab'; lab.textContent=label;
    const bar=document.createElement('div'); bar.className='sysbar';
    const fill=document.createElement('div');
    const p=Math.max(0,Math.min(100,o.pct||0));
    fill.className='sysfill'+(p>=85?' err':p>=60?' warn':'');
    fill.style.width=p+'%';
    bar.appendChild(fill);
    const val=document.createElement('div'); val.className='sysval';
    val.textContent=(o.used||'?')+' / '+(o.total||'?')+' · '+p+'%';
    row.appendChild(lab); row.appendChild(bar); row.appendChild(val); card.appendChild(row);
  };
  fetch('/api/sysinfo',{cache:'no-store'}).then(r=>r.json()).then(d=>{
    show('磁盘',d.disk); show('内存',d.mem); show('Swap',d.swap);
    if(d.load&&d.load.length){
      const row=document.createElement('div'); row.className='sysrow';
      const lab=document.createElement('div'); lab.className='syslab'; lab.textContent='负载';
      const val=document.createElement('div'); val.className='sysval'; val.textContent=d.load.join(' / ');
      row.appendChild(lab); row.appendChild(val); card.appendChild(row);
    }
    if(d.top&&d.top.length){
      const t=document.createElement('div'); t.className='systop';
      t.textContent='最占内存：'+d.top.map(x=>x.name+' '+x.mb+'M').join(' · ');
      card.appendChild(t);
    }
  }).catch(()=>{
    const t=document.createElement('div'); t.className='systop'; t.textContent='读不到资源数据';
    card.appendChild(t);
  });
}
function renderRich(el,text){
  let t=String(text==null?'':text).replace(/[\s\u00a0]+$/,'');
  // 1) 结尾蓝点
  let dot=false;
  let m=/(^|\n)[ \t]*•$/.exec(t);
  if(m){ dot=true; t=t.slice(0,m.index).replace(/[\s\u00a0]+$/,''); }
  // 2) 末尾 ::options 选项块
  let opts=[];
  const om=/(^|\n)[ \t]*::options[ \t]*\n?([\s\S]*)$/.exec(t);
  if(om){
    opts=(om[2]||'').split('\n').map(l=>{
      const mm=/^\s*(?:\d+[.、)]|[-*])\s*(.+?)\s*$/.exec(l);
      return mm?mm[1]:null;
    }).filter(Boolean);
    t=t.slice(0,om.index).replace(/[\s\u00a0]+$/,'');
  }
  // 3) 服务器资源面板 ::sysinfo
  let sys=false;
  const sm=/(^|\n)[ \t]*::sysinfo[ \t]*(?=\n|$)/.exec(t);
  if(sm){ sys=true; t=t.slice(0,sm.index)+t.slice(sm.index+sm[0].length); }

  setRichText(el,t);
  if(opts.length){
    const wrap=document.createElement('div'); wrap.className='opts';
    const btns=[];
    opts.forEach(o=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=o;
      b.onclick=()=>{ btns.forEach(x=>x.disabled=true); if(busy) return; input.value=o; autoGrow(); input.focus(); send(); };
      btns.push(b); wrap.appendChild(b);
    });
    el.appendChild(wrap);
  }
  if(dot){ const d=document.createElement('span'); d.className='enddot';
    d.style.cssText='display:block;width:6px;height:6px;min-height:6px;flex:0 0 auto;border-radius:50%;background:#1E4A9E;margin-top:9px';
    el.appendChild(d); }
  if(sys){ const host=document.createElement('div'); el.appendChild(host); renderSysCard(host); }
}
function setText(node,text){ renderRich(node.text,text); if(text&&node.typing) node.typing.remove(); scroll(); }
function note(node,text,cls){ const d=document.createElement('div'); d.className=cls||'note'; d.textContent=text; node.w.appendChild(d); scroll(); }
function addTool(node,name,label){
  const card=document.createElement('div'); card.className='tool';
  card.innerHTML='<span class="em">'+IC_TERM+'</span><span class="lb">'+esc(name+(label?('  ·  '+label):''))+'</span><span class="st running">进行中</span>';
  node.tools.appendChild(card); if(node.typing) node.typing.remove(); scroll(); return card;
}
function markToolDone(card){ const s=card.querySelector('.st'); if(s){ s.className='st completed'; s.textContent='完成'; } }
function setStatus(node,text){ if(node.typing){ const t=node.typing.querySelector('.t'); if(t) t.textContent=text; } }

async function loadMessages(id){
  clearChat();
  let msgs=[];
  try{ const d=await jget('/api/sessions/'+encodeURIComponent(id)+'/messages');
    msgs = d.data || d.messages || (Array.isArray(d)?d:[]); }catch(e){}
  const real=msgs.filter(m=>m&&(m.role==='user'||m.role==='assistant'));
  if(!real.length){ showEmpty(); return; }
  for(const m of real){
    let content=m.content;
    if(Array.isArray(content)) content=content.map(p=>typeof p==='string'?p:(p&&p.text)||'').join('');
    else if(content&&typeof content==='object') content=content.text||JSON.stringify(content);
    if(m.role==='user') addUser(content);
    else { const a=addAssistant(); renderRich(a.text,content||''); a.text.classList.remove('streaming'); if(a.typing)a.typing.remove(); }
  }
  scroll();
}

/* ── SSE 解析 ── */
async function readSSE(body,onEvent){
  const reader=body.getReader(); const dec=new TextDecoder(); let buf='', ev='message';
  for(;;){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,i); buf=buf.slice(i+1);
      if(line.endsWith('\r')) line=line.slice(0,-1);
      if(line===''){ continue; }
      if(line.startsWith('event:')) ev=line.slice(6).trim();
      else if(line.startsWith('data:')){ const s=line.slice(5).trim(); let j=null; try{j=JSON.parse(s);}catch(_){}
        if(j) onEvent(ev,j); }
    }
  }
}

/* ── 发送 / 停止 ── */
const IC_SEND='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>';
const IC_STOP='<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>';
const IC_TERM='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4 4-4 4M12 15h8"/></svg>';
function setBusy(b){ busy=b; sendBtn.innerHTML=b?IC_STOP:IC_SEND; sendBtn.classList.toggle('stop',b);
  sendBtn.setAttribute('aria-label',b?'停止':'发送');
  sendBtn.title=b?'停止（Esc 可打断）':'发送（Enter）';
  sendBtn.classList.remove('pop'); void sendBtn.offsetWidth; sendBtn.classList.add('pop');
  if(b) sendBtn.classList.remove('idle'); else syncSendIdle();
}
sendBtn.innerHTML=IC_SEND;

/* ── 持久运行：断线 2 秒自动重连 + 断点续传 ── */
async function readSSE2(body,onEvent){
  const reader=body.getReader(); const dec=new TextDecoder(); let buf='', ev='message', id=null;
  for(;;){
    const {value,done}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,i); buf=buf.slice(i+1);
      if(line.endsWith('\r')) line=line.slice(0,-1);
      if(line==='' || line.startsWith(':')) continue;
      if(line.startsWith('event:')) ev=line.slice(6).trim();
      else if(line.startsWith('id:')){ const v=parseInt(line.slice(3).trim(),10); if(!isNaN(v)) id=v; }
      else if(line.startsWith('data:')){
        const s=line.slice(5).trim(); let j=null; try{j=JSON.parse(s);}catch(_){}
        if(j) onEvent(id, ev, j);
      }
    }
  }
}
async function startRun(text){
  const r=await fetch(API+'/v1/runs',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({input:text, session_id:currentId})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  return d.run_id||d.id||null;
}
function handleRunEvent(name,j,node,st){
  if(name==='message.delta'){ st.acc+=(j.delta||''); setText(node,st.acc); }
  else if(name==='tool.started'){ st.lastTool=addTool(node, j.tool||'tool', j.preview||''); setStatus(node,'执行中'); }
  else if(name==='tool.completed'){ if(st.lastTool) markToolDone(st.lastTool); }
  else if(name==='message.interim'){ if(j.text) note(node, j.text); }
  else if(name==='run.completed'){ st.done=true; if(typeof j.output==='string' && j.output) setText(node,j.output); }
  else if(name==='run.failed'){ st.done=true; note(node,'出错了：'+(j.error||j.message||'未知'),'errn'); }
  else if(name==='run.interrupted'){ st.done=true; note(node,'这一轮被中断了（网关重启或长时间断线）。要我接着做，说一声「继续」即可。','note'); }
  else if(name==='error'){ st.done=true; note(node,'出错了：'+(j.message||j.error||'未知'),'errn'); }
}
async function streamRun(rid,node,st){
  let lastSeq=-1, tries=0;
  for(;;){
    try{
      const url=API+'/v1/runs/'+encodeURIComponent(rid)+'/events'+(lastSeq>=0?('?last_seq='+lastSeq):'');
      const res=await fetch(url,{headers:{'accept':'text/event-stream'},cache:'no-store',
        signal:abortCtrl?abortCtrl.signal:undefined});
      if(!res.ok||!res.body) throw new Error('HTTP '+res.status);
      if(st.retryEl){ st.retryEl.remove(); st.retryEl=null; }
      await readSSE2(res.body,(sid,ev,j)=>{
        const name=j.event||ev;
        const sq=(typeof j.seq==='number')?j.seq:sid;
        if(typeof sq==='number') lastSeq=Math.max(lastSeq,sq);
        handleRunEvent(name,j,node,st);
      });
      if(st.done) return;
    }catch(err){
      if(err.name==='AbortError') throw err;
    }
    if(st.done) return;
    tries++;
    if(tries>60){ note(node,'重连很多次都没成功，先停在这里了。','errn'); return; }
    if(!st.retryEl){ st.retryEl=document.createElement('div'); st.retryEl.className='note'; node.w.appendChild(st.retryEl); }
    st.retryEl.textContent='连接中断，2 秒后自动重连…（第 '+tries+' 次）';
    scroll();
    await new Promise(r=>setTimeout(r,2000));
  }
}
async function legacySend(text,node,st){
  const res=await fetch(API+'/api/sessions/'+encodeURIComponent(currentId)+'/chat/stream',
    {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text}),signal:abortCtrl.signal});
  if(!res.ok||!res.body) throw new Error('HTTP '+res.status);
  await readSSE(res.body,(ev,d)=>{
    if(ev==='run.started'){ runId=d.run_id||d.runId||null; }
    else if(ev==='assistant.delta'){ st.acc+=(d.delta||''); setText(node,st.acc); }
    else if(ev==='tool.started'){ st.lastTool=addTool(node, d.tool_name||'tool', d.preview||(d.args&&(d.args.command||d.args.path))||''); setStatus(node,'执行中'); }
    else if(ev==='tool.completed'){ if(st.lastTool) markToolDone(st.lastTool); }
    else if(ev==='tool.progress'){ if(d.delta) setStatus(node, String(d.delta).slice(0,90)); }
    else if(ev==='assistant.completed'){ if(typeof d.content==='string' && d.content){ st.acc=d.content; setText(node,st.acc); } st.done=true; }
    else if(ev==='run.failed'||ev==='error'){ st.done=true; note(node,'出错了：'+(d.message||d.error||'未知'),'errn'); }
  });
  st.done=true;
}
async function send(){
  const text=input.value.trim(); if(busy) return;
  if(!text){ flashInvalid(input); input.focus(); return; }
  stickBottom=true;
  if(!currentId){ await newSession(); if(!currentId) return; }
  input.value=''; autoGrow();
  const emp=chat.querySelector('.empty'); if(emp) emp.remove();
  addUser(text);
  const node=addAssistant();
  setBusy(true); runId=null; abortCtrl=new AbortController();
  const st={acc:'',lastTool:null,retryEl:null,done:false,stopped:false};
  try{
    try{
      runId=await startRun(text);
      if(!runId) throw new Error('no run_id');
      await streamRun(runId,node,st);          // 持久运行：断线可续传
    }catch(e){
      if(e.name==='AbortError') throw e;
      if(st.acc==='' && !node.tools.children.length){   // 还没开始，退回老通道
        note(node,'持久通道没起来，改用普通通道…','note');
        await legacySend(text,node,st);
      } else { throw e; }
    }
  }catch(err){
    if(err.name==='AbortError'){ st.stopped=true; if(node.typing)node.typing.remove(); note(node,'已停止','note'); }
    else { if(node.typing)node.typing.remove();
      note(node,'连接出错了（'+err.message+'）。','errn'); }
  }finally{
    if(node.text) node.text.classList.remove('streaming');
    if(node.typing) node.typing.remove();
    if(!st.acc && !node.tools.children.length && !st.stopped) note(node,'（没有输出）');
    setBusy(false); abortCtrl=null; runId=null;
    refreshSessions();
  }
}
async function stop(){
  try{ if(runId) await jpost('/v1/runs/'+encodeURIComponent(runId)+'/stop',{}); }catch(e){}
  try{ if(abortCtrl) abortCtrl.abort(); }catch(e){}
}

/* ── 输入框 ── */
function autoGrow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,180)+'px'; }
function syncSendIdle(){ sendBtn.classList.toggle('idle',!busy&&!input.value.trim()); }
function flashInvalid(el){
  const host=el.closest('.composer')||el.closest('.todo-foot'); if(!host) return;
  host.classList.remove('invalid'); void host.offsetWidth; host.classList.add('invalid');
  setTimeout(()=>host.classList.remove('invalid'),460);
}
input.addEventListener('input',()=>{ autoGrow(); syncSendIdle(); });
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!busy) send(); } });
form.addEventListener('submit',e=>{ e.preventDefault(); if(!busy) send(); });
sendBtn.addEventListener('click',()=>{ if(busy) stop(); else send(); });
sendBtn.title='发送（Enter）'; sendBtn.setAttribute('aria-label','发送');
syncSendIdle();

/* ── 滚动到底部行为：跟随流式输出，用户上翻时不打扰 ── */
const toBottomBtn=$('#toBottom');
let suppressToBottom=0;   // 程序化平滑滚动期间，别让滚动监听把按钮又弹回来
chat.addEventListener('scroll',()=>{
  const b=atBottom();
  if(Date.now()<suppressToBottom && !b){ stickBottom=false; return; }
  stickBottom=b;
  toBottomBtn.classList.toggle('show',!b);
},{passive:true});
toBottomBtn.addEventListener('click',()=>{
  stickBottom=true; suppressToBottom=Date.now()+2600;
  toBottomBtn.classList.remove('show'); scroll(true);
  setTimeout(()=>{ const b=atBottom(); stickBottom=b; toBottomBtn.classList.toggle('show',!b); },2600);
});

/* ── 键盘快捷键：Ctrl/Cmd+K 聚焦输入，Esc 优先级 抽屉>停止>失焦 ── */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); input.focus(); input.setSelectionRange(input.value.length,input.value.length); return; }
  if(e.key==='Escape'){
    if(sidebar.classList.contains('open')||tp.classList.contains('open')){ sidebar.classList.remove('open'); tp.classList.remove('open'); return; }
    if(busy){ stop(); return; }
    const ae=document.activeElement; if(ae===input||ae===tinput) ae.blur();
  }
});

/* ── 会话相对时间每分钟刷新 ── */
setInterval(()=>{ if(!document.hidden&&sessions.length) renderSessions(); },60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) renderSessions(); });

/* ── 顶部切换 ── */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    if(t.disabled) return;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab==='code'){ const f=document.getElementById('codeframe'); if(f&&!f.src) f.src=f.dataset.src; }
    if(sidebar) sidebar.classList.remove('open');
  });
});
const isNarrow=()=>window.matchMedia('(max-width:720px)').matches;
sideToggle.addEventListener('click',()=>{ if(isNarrow()) sidebar.classList.toggle('open'); else sidebar.classList.toggle('collapsed'); });

$('#newBtn').addEventListener('click',()=>{ newSession(); sidebar.classList.remove('open'); });

/* ── 右侧待办面板 ── */
const tp=$('#todoPanel'), tlist=$('#todoList'), tform=$('#todoForm'), tinput=$('#todoInput'),
      tToday=$('#todoToday'), tTom=$('#todoTomorrow'), tToggle=$('#todoToggle');
let todoDate='today', todoTimer=null;
try{ if(localStorage.getItem('todoPanel')==='0') tp.classList.add('collapsed'); }catch(e){}
function isTodoHidden(){ return tp.classList.contains('collapsed') && !tp.classList.contains('open'); }
function startTodoPoll(){ if(todoTimer) return; todoTimer=setInterval(()=>{ if(!document.hidden && !isTodoHidden()) loadTodos(); },15000); }
function stopTodoPoll(){ if(todoTimer){ clearInterval(todoTimer); todoTimer=null; } }
function setTodoOpen(open){ tp.classList.toggle('collapsed',!open); tp.classList.remove('open');
  try{ localStorage.setItem('todoPanel',open?'1':'0'); }catch(e){}
  if(open){ loadTodos(); startTodoPoll(); } else stopTodoPoll(); }
tToggle.addEventListener('click',()=>{ if(isNarrow()){ const wasOpen=tp.classList.contains('open'); tp.classList.toggle('open',!wasOpen); if(!wasOpen){ loadTodos(); startTodoPoll(); } else stopTodoPoll(); }
  else setTodoOpen(tp.classList.contains('collapsed')); });
function setTodoDate(d){ todoDate=d; tToday.classList.toggle('on',d==='today'); tTom.classList.toggle('on',d==='tomorrow'); loadTodos(); }
tToday.addEventListener('click',()=>setTodoDate('today'));
tTom.addEventListener('click',()=>setTodoDate('tomorrow'));
function renderTodos(d){
  const items=(d&&d.items)||[];
  if(!items.length){ tlist.innerHTML='<div class="todo-empty">还没有待办</div>'; return; }
  tlist.innerHTML='';
  for(const it of items){
    const row=document.createElement('div'); row.className='todo-item'+(it.done?' done':'');
    const cb=document.createElement('div'); cb.className='cb'; cb.textContent=it.done?'\u2713':'';
    const tx=document.createElement('div'); tx.className='tx'; tx.textContent=it.text;
    const act=()=>{                          // 即时反馈：先本地切换，再与服务端对齐
      const nowDone=!row.classList.contains('done');
      row.classList.toggle('done',nowDone); cb.textContent=nowDone?'\u2713':'';
      row.classList.remove('justdone'); void row.offsetWidth; row.classList.add('justdone');
      todoAct(nowDone?'done':'undone', it.n);
    };
    cb.onclick=act; tx.onclick=act;
    const del=document.createElement('div'); del.className='del'; del.textContent='\u00d7'; del.title='删除';
    del.onclick=()=>{ row.classList.add('leaving'); setTimeout(()=>todoAct('rm', it.n),150); };
    row.appendChild(cb); row.appendChild(tx); row.appendChild(del); tlist.appendChild(row);
  }
}
async function loadTodos(){
  try{ const r=await fetch('/api/todos?date='+todoDate,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); renderTodos(await r.json()); }
  catch(e){ tlist.innerHTML='<div class="todo-empty">读不到待办清单</div>'; }
}
async function todoAct(action,n){
  try{ const r=await fetch('/api/todos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,n,date:todoDate})});
    if(r.ok) renderTodos(await r.json()); }catch(e){}
}
tform.addEventListener('submit',async e=>{ e.preventDefault(); const text=tinput.value.trim();
  if(!text){ flashInvalid(tinput); tinput.focus(); return; }
  tinput.value='';
  const emptyEl=tlist.querySelector('.todo-empty'); if(emptyEl) emptyEl.remove();
  const ph=document.createElement('div'); ph.className='todo-item enter';
  const pcb=document.createElement('div'); pcb.className='cb';
  const ptx=document.createElement('div'); ptx.className='tx'; ptx.textContent=text;
  ph.appendChild(pcb); ph.appendChild(ptx); tlist.appendChild(ph);
  tlist.scrollTop=tlist.scrollHeight;
  try{ const r=await fetch('/api/todos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'add',text,date:todoDate})});
    if(r.ok) renderTodos(await r.json()); else loadTodos(); }catch(e){ ph.remove(); }
});
if(!isTodoHidden()){ loadTodos(); startTodoPoll(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !isTodoHidden()) loadTodos(); });

/* ── 定时消息：打开界面时领取未读 ── */
const inboxEl=$('#inbox');
function renderInbox(items){
  if(!items.length){ inboxEl.innerHTML=''; inboxEl.classList.remove('show'); return; }
  inboxEl.innerHTML='';
  for(const it of items){
    const c=document.createElement('div'); c.className='card';
    const hd=document.createElement('div'); hd.className='hd';
    hd.innerHTML='<span class="dot2"></span><span>'+esc(it.job)+' · '+esc(it.time)+'</span>';
    const bd=document.createElement('div'); bd.className='bd'; renderRich(bd,it.text);
    const ack=document.createElement('button'); ack.type='button'; ack.className='ack'; ack.textContent='知道了';
    ack.onclick=()=>ackInbox([it.id]);
    c.appendChild(hd); c.appendChild(bd); c.appendChild(ack);
    inboxEl.appendChild(c);
  }
  inboxEl.classList.add('show');
}
async function refreshInbox(){
  try{ const r=await fetch('/api/inbox',{cache:'no-store'}); if(!r.ok) return; renderInbox((await r.json()).items||[]); }catch(e){}
}
async function ackInbox(ids){
  try{ const r=await fetch('/api/inbox',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})});
    if(r.ok) renderInbox((await r.json()).items||[]); }catch(e){}
}
refreshInbox();
setInterval(refreshInbox,20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshInbox(); });

/* ── 顶栏血条：DSK(血量)=磁盘剩余，MEM(法力)=内存剩余，SWP(体力)=Swap 剩余 ── */
const gDsk=$('#gDsk'), gMem=$('#gMem'), gSwp=$('#gSwp');
function _bytes(v){
  const m=/^([\d.]+)\s*([KMGT]?)/.exec(v||''); if(!m) return 0;
  const u={B:1,K:1e3,M:1e6,G:1e9,T:1e12}[m[2]||'B'];
  return parseFloat(m[1])*u;
}
function setGauge(el,pct,name){
  const p=Math.max(0,Math.min(100,pct||0));
  el.style.width=p+'%';
  const row=el.closest('.gauge'); if(row) row.title=name+' · '+Math.round(p)+'%';
}
async function refreshGauges(){
  try{
    const r=await fetch('/api/sysinfo',{cache:'no-store'}); if(!r.ok) return;
    const d=await r.json();
    const memT=_bytes(d.mem&&d.mem.total), memA=_bytes(d.mem&&d.mem.avail);
    const dskT=_bytes(d.disk&&d.disk.total), dskF=_bytes(d.disk&&d.disk.free);
    const swpT=_bytes(d.swap&&d.swap.total), swpF=_bytes(d.swap&&d.swap.free);
    setGauge(gDsk, dskT?dskF/dskT*100:0, '血量（磁盘剩余）');
    setGauge(gMem, memT?memA/memT*100:0, '法力（内存剩余）');
    setGauge(gSwp, swpT?swpF/swpT*100:0, '体力（Swap 剩余）');
  }catch(e){}
}
refreshGauges();
setInterval(refreshGauges,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshGauges(); });

/* ── 启动 ── */
(async function init(){
  await refreshSessions();
  if(!sessions.length){ await newSession(); }
  else { currentId=sessions[0].id; renderSessions(); await loadMessages(currentId); }
})();
})();
</script>
